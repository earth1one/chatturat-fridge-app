<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บันทึกอุณหภูมิตู้แช่ยาและวัคซีน - โรงพยาบาลจัตุรัส</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1d4ed8;
            --primary-dark: #1e3a8a;
            --primary-light: #3b82f6;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-bottom: env(safe-area-inset-bottom, 20px);
        }

        .header {
            background-color: var(--primary-dark);
            color: white;
            padding: 20px;
            position: relative;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .title-group h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .title-group p {
            font-size: 13px;
            color: #93c5fd;
            line-height: 1.4;
        }

        .history-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
        }

        .criteria-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .criteria-bar::-webkit-scrollbar {
            display: none;
        }

        .criteria-pill {
            background: rgba(255, 255, 255, 0.12);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            white-space: nowrap;
            color: #e0f2fe;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: calc(90px + env(safe-area-inset-bottom, 20px));
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .date-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .date-input-wrapper input[type="date"] {
            width: 100%;
            padding: 12px 16px;
            padding-right: 45px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-main);
            background: #fff;
            appearance: none;
            -webkit-appearance: none;
            font-family: 'Prompt', sans-serif;
        }

        .custom-calendar-icon {
            position: absolute;
            right: 14px;
            color: var(--primary-color);
            pointer-events: none;
            font-size: 18px;
        }

        .location-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid var(--border-color);
            background: #fff;
            color: var(--text-muted);
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
        }

        .chip.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            font-weight: 600;
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper select {
            width: 100%;
            padding: 12px 16px;
            padding-right: 40px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-main);
            background: #fff;
            appearance: none;
            -webkit-appearance: none;
            font-family: 'Prompt', sans-serif;
        }

        .select-arrow {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            font-size: 12px;
        }

        .shift-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .shift-card {
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            background: #fff;
            cursor: pointer;
        }

        .shift-card.active {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }
