<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PharmaTemp - โรงพยาบาลจัตุรัส</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function(){var t=null;try{t=localStorage.getItem("pt-theme")}catch(e){}
if(t!=="light"&&t!=="dark"){t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
document.documentElement.setAttribute("data-theme",t)})();
</script>
<style>
:root{
  --bg:#eef7f2; --surface:#fff; --surface2:#f4faf7; --line:#d9ebe1; --ink:#0b2a1f; --muted:#587367;
  --acc:#0f9d6a; --accInk:#fff; --h1:#12b07a; --h2:#07674a; --bad:#d1383b; --badbg:#fdeaea;
  --fb:#e4f5f3; --fl:#a6dcd6; --fa:#0d8f86; --rb:#fbf0da; --rl:#ecd29b; --ra:#b9770e;
  --shadow:0 8px 24px rgba(15,100,70,.10); --glass:rgba(238,247,242,.82);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light; box-sizing:border-box; padding-top:var(--safe-t);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06130d;--surface:#0e2119;--surface2:#13291f;--line:#1c3a2d;--ink:#e6f5ec;--muted:#8db1a0;--acc:#34d399;--accInk:#032416;--h1:#0f7a56;--h2:#06352a;--bad:#ff7b7b;--badbg:#3a1a1a;--fb:#0d2a2a;--fl:#1f5a57;--fa:#3cd6c8;--rb:#2b2412;--rl:#5c4a1c;--ra:#f0b84d;--shadow:0 8px 24px rgba(0,0,0,.35);--glass:rgba(6,19,13,.82);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#06130d;--surface:#0e2119;--surface2:#13291f;--line:#1c3a2d;--ink:#e6f5ec;--muted:#8db1a0;--acc:#34d399;--accInk:#032416;--h1:#0f7a56;--h2:#06352a;--bad:#ff7b7b;--badbg:#3a1a1a;--fb:#0d2a2a;--fl:#1f5a57;--fa:#3cd6c8;--rb:#2b2412;--rl:#5c4a1c;--ra:#f0b84d;--shadow:0 8px 24px rgba(0,0,0,.35);--glass:rgba(6,19,13,.82);color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
html{scroll-padding-top:var(--safe-t)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.45 "Anuphan",system-ui,sans-serif;transition:background .25s,color .25s}
.app{max-width:480px;margin:0 auto;padding:14px 16px calc(120px + var(--safe-b))}
.top{display:flex;align-items:center;gap:10px}
.mark{flex:none;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--h1),var(--h2));display:grid;place-items:center}
.top h1{margin:0;font-size:18px;font-weight:700;line-height:1.2}
.top small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.sp{flex:1}
.ib{flex:none;min-width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;font:inherit;font-size:15px;font-weight:600;padding:0 12px;cursor:pointer}
.ico-sun{display:none}
[data-theme="dark"] .ico-sun{display:block}
[data-theme="dark"] .ico-moon{display:none}
.nav-tabs{display:flex;gap:8px;margin-top:16px}
.nav-tab{flex:1;height:46px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--muted);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.nav-tab.active{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.hero{position:relative;overflow:hidden;margin-top:16px;padding:18px;border-radius:26px;color:#fff;background:linear-gradient(135deg,var(--h1),var(--h2));box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero small{display:block;font-size:14px;opacity:.85}
.hero b{display:block;font-size:22px;font-weight:700;line-height:1.25;margin-top:2px}
.hero .chg{position:relative;display:inline-block;margin-top:10px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.18);font-size:14px;font-weight:600;cursor:pointer}
.hero .chg input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.ring{position:relative;z-index:1;flex:none;width:84px;height:84px}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:700}
.cap{margin:24px 2px 10px;font-size:15px;font-weight:600;color:var(--muted)}
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n,2),1fr);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n,2));background:var(--acc);border-radius:14px;transition:transform .25s;transform:translateX(calc(var(--r,0)*100%))}
.seg button{position:relative;z-index:1;height:54px;border:0;background:none;color:var(--muted);font:inherit;font-size:16px;font-weight:600;line-height:1.15;cursor:pointer}
.seg button small{display:block;font-size:12px;font-weight:500;opacity:.85}
.seg button[aria-pressed=true]{color:var(--accInk)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:46px;padding:0 16px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.ar{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ar.on{display:grid}
.ar button{min-height:50px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.ar button[aria-pressed=true]{border-color:var(--acc);background:var(--surface2);color:var(--acc)}
.card{margin-bottom:12px;border-radius:22px;padding:14px;border:1.5px solid var(--cl);background:var(--cb);box-shadow:var(--shadow);transition:border-color .2s,background .2s}
.card.f{--cb:var(--fb);--cl:var(--fl);--ca:var(--fa)}
.card.r{--cb:var(--rb);--cl:var(--rl);--ca:var(--ra)}
.card.out{--cb:var(--badbg);--cl:var(--bad)}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:16px;font-weight:700;color:var(--ca)}
.card.out .ch{color:var(--bad)}
.ch svg{flex:none}
.ms{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ms.one{grid-template-columns:1fr}
.ml{display:flex;flex-direction:column;font-size:14px;font-weight:600}
.ml small{font-size:12px;font-weight:500;color:var(--muted)}
.v{display:flex;align-items:baseline;gap:4px;margin-top:6px}
.v input{width:100%;min-width:0;height:54px;border:1.5px solid transparent;border-radius:14px;background:var(--surface);color:var(--ink);text-align:center;font:700 26px/1 "Anuphan",system-ui,sans-serif;padding:0}
.v input:focus{outline:0;border-color:var(--ca)}
.v .u{flex:none;font-size:12px;color:var(--muted);font-weight:600;width:30px}
.gauge{position:relative;height:6px;border-radius:6px;background:var(--surface);margin:12px 2px 4px}
.gauge b{position:absolute;top:0;bottom:0;background:var(--ca);opacity:.35;border-radius:6px}
.gauge u{position:absolute;top:50%;left:0;width:14px;height:14px;border-radius:50%;background:var(--ca);border:3px solid var(--surface);transform:translate(-50%,-50%);transition:left .25s;opacity:0}
.m.has .gauge u{opacity:1}
.m.out .gauge u{background:var(--bad)}
.m.out input{color:var(--bad);border-color:var(--bad)}
.st{margin:4px 0 0;font-size:12px;font-weight:600;color:var(--muted);min-height:18px}
.m.ok .st{color:var(--ca)} .m.out .st{color:var(--bad)}
.field{width:100%;border:1.5px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);font:inherit;font-size:17px;font-weight:500;padding:0 16px}
input.field{height:56px}
textarea.field{min-height:92px;padding:12px 16px;resize:vertical}
.field:focus{outline:0;border-color:var(--acc)}
.field::placeholder{color:var(--muted);opacity:.7}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.people button{min-height:56px;padding:6px 12px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;font-weight:600;text-align:left;line-height:1.25;cursor:pointer}
.people button small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.people button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.people button[aria-pressed=true] small{color:var(--accInk);opacity:.85}
.hint{display:none;margin:0 2px 8px;font-size:14px;font-weight:600;color:var(--bad)}
.hint.on{display:block}
.hint.on+textarea{border-color:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + var(--safe-b));background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.save{display:block;width:100%;max-width:448px;margin:0 auto;height:58px;border:0;border-radius:20px;background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;font:inherit;font-size:18px;font-weight:700;box-shadow:var(--shadow);cursor:pointer}
.save:active{transform:scale(.985)}
.save:disabled{background:var(--surface2);color:var(--muted);box-shadow:none;border:1px solid var(--line);cursor:not-allowed}
.save.warn{background:var(--bad)}
[data-theme="dark"] .save.warn{color:#2a0707}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translate(-50%,14px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-size:15px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;z-index:999}
.toast.on{opacity:1;transform:translate(-50%,0)}
.history-container{display:none;margin-top:16px}
.history-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.history-card h3{margin:0 0 6px;font-size:16px;color:var(--h1)}
.history-card p{margin:4px 0;font-size:14px;color:var(--muted)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg></div>
    <div><h1>โรงพยาบาลจัตุรัส</h1><small>บันทึกอุณหภูมิและความชื้น</small></div>
    <span class="sp"></span>
    <button class="ib" type="button" id="theme" aria-label="สลับโหมดกลางวัน/กลางคืน">
      <svg class="ico-moon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ico-sun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <div class="nav-tabs">
    <button class="nav-tab active" type="button" id="tab-record" onclick="switchTab('record')">บันทึกข้อมูล</button>
    <button class="nav-tab" type="button" id="tab-history" onclick="switchTab('history')">ดูข้อมูลย้อนหลัง</button>
  </div>

  <div id="section-record">
    <section class="hero">
      <div style="position:relative;z-index:1">
        <small id="rl"></small><b id="dv"></b>
        <label class="chg">เปลี่ยนวัน<input type="date" id="date" aria-label="เปลี่ยนวันที่"></label>
      </div>
      <div class="ring"><svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="8"/><circle id="arc" cx="42" cy="42" r="34" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6" style="transition:stroke-dashoffset .35s"/></svg><span id="prog">0/0</span></div>
    </section>

    <p class="cap">รอบเวลา</p>
    <div class="seg" id="seg" role="group" aria-label="รอบเวลา"></div>

    <p class="cap">สถานที่</p>
    <div class="chips" id="zones"></div>
    <div class="ar" id="areas" role="group" aria-label="พื้นที่ย่อย"></div>

    <p class="cap">ค่าที่วัดได้</p>
    <div id="list"></div>

    <p class="cap">ผู้บันทึก</p>
    <div class="people" id="people" role="group" aria-label="เลือกผู้บันทึก"></div>
    <input class="field" id="who" type="text" autocomplete="name" placeholder="ชื่อ-นามสกุล หรือชื่อเล่น" aria-label="ผู้บันทึก">

    <p class="cap">หมายเหตุ</p>
    <p class="hint" id="hint">มีค่านอกเกณฑ์ ระบุสิ่งที่ทำหรือคนที่แจ้ง</p>
    <textarea class="field" id="note" placeholder="หมายเหตุ (ถ้ามี)" aria-label="หมายเหตุ"></textarea>
  </div>

  <div id="section-history" class="history-container">
    <p class="cap">ประวัติการบันทึกทั้งหมด</p>
    <div style="margin-bottom: 12px;">
      <button class="nav-tab active" type="button" onclick="loadHistory()" style="width: 100%;">🔄 โหลด/รีเฟรชข้อมูลใหม่</button>
    </div>
    <div id="history-list">
      <p style="text-align:center; color:var(--muted);">กำลังโหลดข้อมูล...</p>
    </div>
  </div>
</div>

<div class="bar" id="bar-save"><button class="save" type="button" id="save" disabled></button></div>
<div class="toast" id="toast" role="status">บันทึกข้อมูลแล้ว</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzPHn2oZs-h5hqM4XsWpeaCZ1R8V21IycWhX_3B2UKJjTAoz9kKLzFn9q-ZQgjZZgZItQ/exec"; 

const ZONES=[["ห้องยาตึกใหม่",["ห้องหลัก","Substock"]],["ห้องยาตึกเก่า",["ห้องหลัก","Substock"]],["คลังยา",["คลังยา (หลัก)"]],["ห้องผลิตชั้นบน",["ห้องผลิตชั้นบน"]],["ห้องผลิตชั้นล่าง",["ห้องผลิตชั้นล่าง"]]];
const $=s=>document.querySelector(s), pad=n=>String(n).padStart(2,"0"), now=new Date(), root=document.documentElement;
let round=now.getHours()<12?0:now.getHours()<18?1:2, zone=0, area=0; const saved={};

$("#theme").addEventListener("click",()=>{
  const next=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",next);
  try{localStorage.setItem("pt-theme",next)}catch(e){}
});

const STAFF={0:[["ภัทราภรณ์","เช็คตู้เย็น",null],["เพ็ญลักษณ์","ห้องหลัก",0],["ณัชชา","Substock",1]],1:[["ระพีพรรณ"],["รณชัย"]],2:[["พงศ์พันธ์"],["นาวิน"]]};
let who="";
const getWho=()=>STAFF[zone]?who:$("#who").value.trim();
function people(){
  const s=STAFF[zone], box=$("#people");
  box.style.display=s?"grid":"none";$("#who").style.display=s?"none":"block";
  let last="";try{last=localStorage.getItem("pt-who-"+zone)||""}catch(e){}
  if(!s){who="";$("#who").value=last;return}
  who=s.some(p=>p[0]===last)?last:"";
  box.innerHTML=s.map(p=>`<button type="button" data-n="${p[0]}" aria-pressed="${p[0]===who}">${p[0]}${p[1]?`<small>${p[1]}</small>`:""}</button>`).join("");
}
$("#people").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const p=STAFF[zone].find(x=>x[0]===b.dataset.n);who=p[0];
  const move=p[2]!=null&&p[2]!==area;
  if(move){area=p[2];areas();build()}
  people2();update();
});
function people2(){$("#people").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.n===who))}

$("#date").value=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
const dstr=()=>new Date($("#date").value+"T00:00").toLocaleDateString("th-TH",{day:"numeric",month:"long",year:"numeric"});
const key=(z,a)=>$("#date").value+"|"+round+"|"+z+"|"+a;
function showDate(){$("#dv").textContent=dstr();chips();areas()}
$("#date").addEventListener("change",showDate);

const R2=[["รอบเช้า","09:00"],["รอบบ่าย","14:30"]], R3=[...R2,["รอบเย็น","20:30"]];
const rounds=()=>zone===0?R3:R2;
function setRound(i){
  const rs=rounds();i=Math.min(i,rs.length-1);round=i;
  const sg=$("#seg");sg.style.setProperty("--n",rs.length);sg.style.setProperty("--r",i);
  sg.innerHTML="<i></i>"+rs.map((r,k)=>`<button type="button" data-i="${k}" aria-pressed="${k===i}">${r[0]}<small>${r[1]} น.</small></button>`).join("");
  $("#rl").textContent=rs[i][0]+" · "+rs[i][1]+" น.";chips();areas()}
$("#seg").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setRound(+b.dataset.i)});

function chips(){$("#zones").innerHTML=ZONES.map((z,i)=>`<button class="chip" type="button" data-i="${i}" aria-pressed="${i===zone}">${z[0]}${z[1].every((_,k)=>saved[key(i,k)])?" ✓":""}</button>`).join("")}
function areas(){
  const a=ZONES[zone][1], box=$("#areas");
  box.classList.toggle("on",a.length>1);
  box.innerHTML=a.map((n,k)=>`<button type="button" data-k="${k}" aria-pressed="${k===area}">${n}${saved[key(zone,k)]?" ✓":""}</button>`).join("");
}
$("#zones").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;zone=+b.dataset.i;area=0;setRound(round);people();build()});
$("#areas").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;area=+b.dataset.k;areas();build()});

const F={lo:2,hi:8,min:0,max:12,u:"°C",r:"2–8"}, R={lo:15,hi:30,min:15,max:40,u:"°C",r:"< 30"}, H={lo:30,hi:70,min:0,max:100,u:"%RH",r:"30–70"};
const ICF='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M5 10h14M9 6v1M9 14v2"/></svg>';
const ICR='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>';
function metric(t,label,who){
  const p=v=>(v-t.min)/(t.max-t.min)*100;
  return `<div class="m" data-lo="${t.lo}" data-hi="${t.hi}" data-min="${t.min}" data-max="${t.max}">
  <span class="ml">${label}<small>${t.r} ${t.u}</small></span>
  <div class="v"><input inputmode="decimal" enterkeyhint="next" autocomplete="off" placeholder="0.0" aria-label="${who} ${label}"><span class="u">${t.u}</span></div>
  <div class="gauge"><b style="left:${p(t.lo)}%;width:${p(t.hi)-p(t.lo)}%"></b><u></u></div><p class="st"></p></div>`;
}
const fridge=n=>`<div class="card f"><div class="ch">${ICF}${n}</div><div class="ms">${metric(F,"อุณหภูมิ",n)+metric(H,"ความชื้น",n)}</div></div>`;
function build(){
  const name=ZONES[zone][0];
  if(zone===0&&area===1){
    $("#list").innerHTML=`<div class="card r"><div class="ch">${ICR}ห้องยา (Substock)</div><div class="ms">${metric(R,"อุณหภูมิ","Substock")+metric(H,"ความชื้น","Substock")}</div></div>`;
    $("#note").value="";update();return;
  }
  const fr=name==="คลังยา"?["ตู้ T31","ตู้ T32","ตู้ TH1","ตู้ TV1"].map(fridge).join(""):fridge("ตู้เย็น");
  $("#list").innerHTML=fr+`<div class="card r"><div class="ch">${ICR}ห้องยา</div><div class="ms">${metric(R,"อุณหภูมิ","ห้องยา")+metric(H,"ความชื้น","ห้องยา")}</div></div>`;
  $("#note").value="";update();
}
function update(){
  const ms=[...document.querySelectorAll(".m")];let n=0,out=0;
  ms.forEach(c=>{
    const v=parseFloat(c.querySelector("input").value.replace(",","."));
    const has=!isNaN(v), lo=+c.dataset.lo, hi=+c.dataset.hi, mn=+c.dataset.min, mx=+c.dataset.max;
    const low=has&&v<lo&&lo>mn, high=has&&v>hi, bad=low||high;
    c.classList.toggle("has",has);c.classList.toggle("out",bad);c.classList.toggle("ok",has&&!bad);
    const st=c.querySelector(".st");
    if(has){n++;if(bad)out++;c.querySelector("u").style.left=Math.max(0,Math.min(100,(v-mn)/(mx-mn)*100))+"%";
      st.textContent=bad?(low?"ต่ำกว่าเกณฑ์":"สูงกว่าเกณฑ์"):"ปกติ"}else st.textContent="";
  });
  document.querySelectorAll(".card").forEach(c=>c.classList.toggle("out",!!c.querySelector(".m.out")));
  const miss=ms.length-n, w=getWho();
  $("#prog").textContent=n+"/"+ms.length;
  $("#arc").style.strokeDashoffset=213.6*(1-n/ms.length);
  $("#hint").classList.toggle("on",out>0);
  const b=$("#save");b.disabled=miss>0||!w;b.classList.toggle("warn",miss===0&&!!w&&out>0);
  b.textContent=miss>0?`กรอกอีก ${miss} ช่อง`:!w?(STAFF[zone]?"เลือกผู้บันทึก":"ใส่ชื่อผู้บันทึก"):out>0?`บันทึก (มีค่านอกเกณฑ์ ${out} ช่อง)`:"บันทึกข้อมูล";
}
document.addEventListener("input",e=>{if(e.target.matches(".m input,#who"))update()});
document.addEventListener("focusin",e=>{if(e.target.matches(".m input"))setTimeout(()=>e.target.scrollIntoView({block:"center",behavior:"smooth"}),250)});
document.addEventListener("keydown",e=>{if(e.key!=="Enter"||!e.target.matches(".m input"))return;
  const a=[...document.querySelectorAll(".m input")],n=a[a.indexOf(e.target)+1];n?n.focus():e.target.blur()});

function switchTab(tab) {
  if(tab === 'record') {
    $("#tab-record").classList.add("active");
    $("#tab-history").classList.remove("active");
    $("#section-record").style.display = "block";
    $("#section-history").style.display = "none";
    $("#bar-save").style.display = "block";
  } else {
    $("#tab-history").classList.add("active");
    $("#tab-record").classList.remove("active");
    $("#section-record").style.display = "none";
    $("#section-history").style.display = "block";
    $("#bar-save").style.display = "none";
    loadHistory();
  }
}

async function loadHistory() {
  const historyList = $("#history-list");
  historyList.innerHTML = `<p style="text-align:center; color:var(--muted);">กำลังโหลดข้อมูลจาก Google Sheets...</p>`;
  try {
    let response = await fetch(APPS_SCRIPT_URL);
    let data = await response.json();
    if(!data || data.length === 0) {
      historyList.innerHTML = `<p style="text-align:center; color:var(--muted);">ยังไม่มีประวัติการบันทึกข้อมูล</p>`;
      return;
    }
    historyList.innerHTML = data.map(item => `
      <div class="history-card">
        <h3>📍 ${item.location} (${item.subLocation || '-'})</h3>
        <p><b>📅 วันที่:</b> ${item.date} | <b>⏰ รอบ:</b> ${item.shift}</p>
        <p><b>🌡️ อุณหภูมิตู้เย็น:</b> ${item.fridgeTemp !== "" ? item.fridgeTemp + " °C" : "-"} | <b>🌡️ อุณหภูมิห้อง:</b> ${item.roomTemp !== "" ? item.roomTemp + " °C" : "-"} | <b>💧 ความชื้น:</b> ${item.humidity !== "" ? item.humidity + " %RH" : "-"}</p>
        <p><b>✍️ ผู้บันทึก:</b> ${item.who || "-"} ${item.note ? `| <b>📝 หมายเหตุ:</b> ${item.note}` : ""}</p>
      </div>
    `).join("");
  } catch (err) {
    historyList.innerHTML = `<p style="text-align:center; color:var(--bad);">เกิดข้อผิดพลาดในการโหลดข้อมูล: ${err.message}</p>`;
  }
}

$("#save").addEventListener("click", async ()=>{
  const saveBtn = $("#save");
  saveBtn.disabled = true;
  saveBtn.textContent = "กำลังบันทึก...";

  const inputs = document.querySelectorAll(".m");
  let fridgeTemp = "", roomTemp = "", humidity = "";

  inputs.forEach(m => {
    const label = m.querySelector(".ml").textContent;
    const val = m.querySelector("input").value;
    if(label.includes("ตู้เย็น") || label.includes("ตู้ T") || label.includes("ตู้ TH") || label.includes("ตู้ TV")) {
      fridgeTemp = val;
    } else if(label.includes("อุณหภูมิ")) {
      roomTemp = val;
    } else if(label.includes("ความชื้น")) {
      humidity = val;
    }
  });

  const payload = {
    date: $("#date").value,
    location: ZONES[zone][0],
    subLocation: ZONES[zone][1][area],
    shift: rounds()[round][0],
    fridgeTemp: fridgeTemp,
    roomTemp: roomTemp,
    humidity: humidity,
    who: getWho(),
    note: $("#note").value
  };

  try {
    await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    try{localStorage.setItem("pt-who-"+zone,getWho())}catch(e){}
    saved[key(zone,area)]=true; chips(); areas(); build();
    
    const t=$("#toast"); t.classList.add("on"); 
    setTimeout(()=>t.classList.remove("on"),1800); 
    scrollTo({top:0,behavior:"smooth"});
  } catch(err) {
    alert("บันทึกไม่สำเร็จ: " + err);
  } finally {
    update();
  }
});

setRound(round); showDate(); people(); build();
</script>
</body>
</html>
