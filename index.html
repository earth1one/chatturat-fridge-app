<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PharmaTemp - โรงพยาบาลจัตุรัส</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- เรียกใช้งานไลบรารีพลุ (Canvas Confetti) -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
(function(){var t=null;try{t=localStorage.getItem("pt-theme")}catch(e){}
if(t!=="light"&&t!=="dark"){t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
document.documentElement.setAttribute("data-theme",t)})();
</script>
<style>
:root{
  --bg:#eef7f2; --surface:#fff; --surface2:#f4faf7; --line:#d9ebe1; --ink:#0b2a1f; --muted:#587367;
  --acc:#0f9d6a; --accInk:#fff; --h1:#12b07a; --h2:#07674a; --bad:#d1383b; --badbg:#fdeaea;
  --fb:#e4f5f3; --fl:#a6dcd6; --fa:#0d8f86; --rb:#fbf0da; --rl:#ecd29b; --ra:#b9770e;
  --shadow:0 8px 24px rgba(15,100,70,.10); --glass:rgba(238,247,242,.82);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light; box-sizing:border-box; padding-top:var(--safe-t);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06130d;--surface:#0e2119;--surface2:#13291f;--line:#1c3a2d;--ink:#e6f5ec;--muted:#8db1a0;--acc:#34d399;--accInk:#032416;--h1:#0f7a56;--h2:#06352a;--bad:#ff7b7b;--badbg:#3a1a1a;--fb:#0d2a2a;--fl:#1f5a57;--fa:#3cd6c8;--rb:#2b2412;--rl:#5c4a1c;--ra:#f0b84d;--shadow:0 8px 24px rgba(0,0,0,.35);--glass:rgba(6,19,13,.82);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#06130d;--surface:#0e2119;--surface2:#13291f;--line:#1c3a2d;--ink:#e6f5ec;--muted:#8db1a0;--acc:#34d399;--accInk:#032416;--h1:#0f7a56;--h2:#06352a;--bad:#ff7b7b;--badbg:#3a1a1a;--fb:#0d2a2a;--fl:#1f5a57;--fa:#3cd6c8;--rb:#2b2412;--rl:#5c4a1c;--ra:#f0b84d;--shadow:0 8px 24px rgba(0,0,0,.35);--glass:rgba(6,19,13,.82);color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
html{scroll-padding-top:var(--safe-t)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.45 "Anuphan",system-ui,sans-serif;transition:background .25s,color .25s}
.app{max-width:480px;margin:0 auto;padding:14px 16px calc(120px + var(--safe-b))}
.top{display:flex;align-items:center;gap:10px}
.mark{flex:none;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--h1),var(--h2));display:grid;place-items:center}
.top h1{margin:0;font-size:18px;font-weight:700;line-height:1.2}
.top small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.sp{flex:1}
.ib{flex:none;min-width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;font:inherit;font-size:15px;font-weight:600;padding:0 12px;cursor:pointer}
.ico-sun{display:none}
[data-theme="dark"] .ico-sun{display:block}
[data-theme="dark"] .ico-moon{display:none}
.nav-tabs{display:flex;gap:8px;margin-top:16px}
.nav-tab{flex:1;height:46px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--muted);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.nav-tab.active{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.hero{position:relative;overflow:hidden;margin-top:16px;padding:18px;border-radius:26px;color:#fff;background:linear-gradient(135deg,var(--h1),var(--h2));box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero small{display:block;font-size:14px;opacity:.85}
.hero b{display:block;font-size:22px;font-weight:700;line-height:1.25;margin-top:2px}
.hero .chg{position:relative;display:inline-block;margin-top:10px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.18);font-size:14px;font-weight:600;cursor:pointer}
.hero .chg input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.ring{position:relative;z-index:1;flex:none;width:84px;height:84px}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:700}
.cap{margin:24px 2px 10px;font-size:15px;font-weight:600;color:var(--muted)}
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n,2),1fr);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n,2));background:var(--acc);border-radius:14px;transition:transform .25s;transform:translateX(calc(var(--r,0)*100%))}
.seg button{position:relative;z-index:1;height:54px;border:0;background:none;color:var(--muted);font:inherit;font-size:16px;font-weight:600;line-height:1.15;cursor:pointer}
.seg button small{display:block;font-size:12px;font-weight:500;opacity:.85}
.seg button[aria-pressed=true]{color:var(--accInk)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:46px;padding:0 16px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.ar{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ar.on{display:grid}
.ar button{min-height:50px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.ar button[aria-pressed=true]{border-color:var(--acc);background:var(--surface2);color:var(--acc)}
.card{margin-bottom:12px;border-radius:22px;padding:14px;border:1.5px solid var(--cl);background:var(--cb);box-shadow:var(--shadow);transition:border-color .2s,background .2s}
.card.f{--cb:var(--fb);--cl:var(--fl);--ca:var(--fa)}
.card.r{--cb:var(--rb);--cl:var(--rl);--ca:var(--ra)}
.card.out{--cb:var(--badbg);--cl:var(--bad)}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:16px;font-weight:700;color:var(--ca)}
.card.out .ch{color:var(--bad)}
.ch svg{flex:none}
.ms{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ms.one{grid-template-columns:1fr}
.ml{display:flex;flex-direction:column;font-size:14px;font-weight:600}
.ml small{font-size:12px;font-weight:500;color:var(--muted)}
.v{display:flex;align-items:baseline;gap:4px;margin-top:6px}
.v input{width:100%;min-width:0;height:54px;border:1.5px solid transparent;border-radius:14px;background:var(--surface);color:var(--ink);text-align:center;font:700 26px/1 "Anuphan",system-ui,sans-serif;padding:0}
.v input:focus{outline:0;border-color:var(--ca)}
.v .u{flex:none;font-size:12px;color:var(--muted);font-weight:600;width:30px}
.gauge{position:relative;height:6px;border-radius:6px;background:var(--surface);margin:12px 2px 4px}
.gauge b{position:absolute;top:0;bottom:0;background:var(--ca);opacity:.35;border-radius:6px}
.gauge u{position:absolute;top:50%;left:0;width:14px;height:14px;border-radius:50%;background:var(--ca);border:3px solid var(--surface);transform:translate(-
