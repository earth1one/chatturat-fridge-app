<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pharmaTemp</title>
    <!-- ไอคอนและชื่อแอปบนมือถือ -->
    <link rel="apple-touch-icon" href="pharmaTemp.jpg">
    <link rel="icon" type="image/jpeg" href="pharmaTemp.jpg">
    <meta name="apple-mobile-web-app-title" content="PharmaTemp">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-800 min-h-screen pb-16">

    <!-- Header -->
    <header class="bg-blue-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-blue-900 p-2 rounded-xl shadow">
                    <i class="fa-solid fa-hospital text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight">โรงพยาบาลจัตุรัส</h1>
                    <p class="text-xs text-blue-200">ระบบบันทึกอุณหภูมิและความชื้น</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 mt-4 space-y-4">

        <!-- Top Info Cards -->
        <div class="grid grid-cols-3 gap-2 text-center text-xs">
            <div class="bg-white p-2.5 rounded-xl shadow-sm border border-slate-100">
                <p class="text-slate-400">ตู้เย็น</p>
                <p class="font-bold text-slate-700 mt-0.5">2.0-8.0 °C</p>
            </div>
            <div class="bg-white p-2.5 rounded-xl shadow-sm border border-slate-100">
                <p class="text-slate-400">ความชื้น</p>
                <p class="font-bold text-slate-700 mt-0.5">30-70 %RH</p>
            </div>
            <div class="bg-white p-2.5 rounded-xl shadow-sm border border-slate-100">
                <p class="text-slate-400">รอบบันทึก</p>
                <p class="font-bold text-slate-700 mt-0.5">09:00 / 14:30</p>
            </div>
        </div>

        <!-- Form Section -->
        <form id="tempForm" onsubmit="handleSubmit(event)" class="space-y-4">
            
            <!-- Card 1: ข้อมูลการบันทึก -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 space-y-4">
                <h2 class="font-bold text-blue-900 text-sm flex items-center space-x-2">
                    <i class="fa-solid fa-file-pen"></i>
                    <span>ข้อมูลการบันทึก</span>
                </h2>

                <!-- วันที่บันทึก -->
                <div>
                    <label class="block text-slate-600 text-xs font-semibold mb-1">วันที่บันทึก</label>
                    <input type="date" id="recordDate" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm font-medium">
                </div>

                <!-- สถานที่ / โซนพื้นที่ (Interactive Buttons) -->
                <div>
                    <label class="block text-slate-600 text-xs font-semibold mb-1.5">สถานที่ / โซนพื้นที่</label>
                    <div class="grid grid-cols-2 gap-2" id="zoneButtonsContainer">
                        <!-- Rendered by JS -->
                    </div>
                    <input type="hidden" id="zoneCategory" required>
                </div>

                <!-- ระบุห้องผลิตย่อย (แสดงเฉพาะตอนเลือกห้องผลิต) -->
                <div id="subLocationContainer" class="hidden">
                    <label class="block text-slate-600 text-xs font-semibold mb-1">ระบุหมายเลขห้องผลิต</label>
                    <select id="fridgeName" onchange="loadTable()" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm font-medium">
                        <!-- Injected by JS -->
                    </select>
                </div>

                <!-- รอบเวลา (Interactive Buttons) -->
                <div>
                    <label class="block text-slate-600 text-xs font-semibold mb-1.5">รอบเวลา</label>
                    <div class="grid grid-cols-2 gap-2" id="sessionButtonsContainer">
                        <!-- Rendered by JS -->
                    </div>
                    <input type="hidden" id="recordSession" required>
                </div>
            </div>

            <!-- Card 2: ค่าที่วัดได้ -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 space-y-4">
                <h2 class="font-bold text-blue-900 text-sm flex items-center space-x-2">
                    <i class="fa-solid fa-gauge"></i>
                    <span>ค่าที่วัดได้</span>
                </h2>

                <!-- อุณหภูมิตู้เย็น -->
                <div>
                    <label class="block text-slate-600 text-xs font-semibold mb-1">อุณหภูมิตู้เย็น (°C)</label>
                    <div class="relative">
                        <input type="number" step="0.1" id="temperature" placeholder="เช่น 5.2" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm font-medium pr-8">
                        <span class="absolute right-3 top-2.5 text-slate-400 text-sm">°C</span>
                    </div>
                    <!-- แถบเกณฑ์มาตรฐาน -->
                    <div class="mt-2 bg-slate-100 h-2 rounded-full overflow-hidden relative">
                        <div class="absolute left-[16.66%] right-[33.33%] top-0 bottom-0 bg-emerald-400 opacity-75"></div>
                    </div>
                    <div class="flex justify-between text-[10px] text-slate-400 mt-0.5 px-0.5">
                        <span>0</span>
                        <span>2</span>
                        <span>8</span>
                        <span>12</span>
                    </div>
                </div>

                <!-- อุณหภูมิห้องยา & ความชื้น -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-slate-600 text-xs font-semibold mb-1">อุณหภูมิห้องยา (°C)</label>
                        <div class="relative">
                            <input type="number" step="0.1" id="roomTemp" placeholder="เช่น 25.0" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm font-medium pr-8">
                            <span class="absolute right-3 top-2.5 text-slate-400 text-sm">°C</span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-slate-600 text-xs font-semibold mb-1">ความชื้น (% RH)</label>
                        <div class="relative">
                            <input type="number" step="1" id="humidity" placeholder="เช่น 55" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm font-medium pr-8">
                            <span class="absolute right-3 top-2.5 text-slate-400 text-sm">%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card 3: ผู้บันทึกข้อมูล -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 space-y-3">
                <h2 class="font-bold text-blue-900 text-sm flex items-center space-x-2">
                    <i class="fa-solid fa-user-pen"></i>
                    <span>ผู้บันทึกข้อมูล</span>
                </h2>
                <div id="recorderContainer">
                    <!-- Dynamic: Input or Select -->
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-2xl shadow transition text-base flex items-center justify-center space-x-2">
                <i class="fa-solid fa-floppy-disk"></i>
                <span>บันทึกข้อมูล</span>
            </button>
        </form>

        <!-- History Table Section -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-blue-900 text-sm flex items-center space-x-2">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>ประวัติการบันทึกย้อนหลัง</span>
                </h2>
                <button onclick="exportCSV()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg transition font-medium">
                    <i class="fa-solid fa-download mr-1"></i> Export
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead>
                        <tr class="border-b border-slate-100 text-slate-400 uppercase">
                            <th class="pb-2 font-semibold">วันที่ / รอบ</th>
                            <th class="pb-2 font-semibold">สถานที่</th>
                            <th class="pb-2 font-semibold">ตู้เย็น</th>
                            <th class="pb-2 font-semibold">ห้องยา</th>
                            <th class="pb-2 font-semibold">ความชื้น</th>
                            <th class="pb-2 font-semibold">สถานะ</th>
                            <th class="pb-2 font-semibold">ผู้บันทึก</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody" class="divide-y divide-slate-50">
                        <!-- Injected by JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Script Application Logic -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyl4LhBzFHdE8SsNu70iJnJDQfH7QDIbLzFyXqJJSdFj1bfagMEmf0nJwRZcruVagVhVA/exec";

        document.getElementById('recordDate').valueAsDate = new Date();

        const zones = ['ห้องยาเก่า', 'ห้องยาตึกใหม่', 'คลังยา', 'ห้องผลิตชั้นบน', 'ห้องผลิตชั้นล่าง'];
        let selectedZone = 'ห้องยาเก่า';
        let selectedSession = '';

        function renderZoneButtons() {
            const container = document.getElementById('zoneButtonsContainer');
            container.innerHTML = '';
            zones.forEach(z => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `py-2.5 px-3 rounded-xl text-xs font-semibold border transition text-center truncate ${selectedZone === z ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`;
                btn.textContent = z;
                btn.onclick = () => {
                    selectedZone = z;
                    document.getElementById('zoneCategory').value = z;
                    renderZoneButtons();
                    updateSubLocations();
                    loadTable();
                };
                container.appendChild(btn);
            });
            document.getElementById('zoneCategory').value = selectedZone;
        }

        function renderSessionButtons(sessions) {
            const container = document.getElementById('sessionButtonsContainer');
            container.innerHTML = '';
            if (!sessions.includes(selectedSession)) {
                selectedSession = sessions[0];
            }
            sessions.forEach(s => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `py-2.5 px-3 rounded-xl text-xs font-semibold border transition text-center ${selectedSession === s ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`;
                btn.textContent = s;
                btn.onclick = () => {
                    selectedSession = s;
                    document.getElementById('recordSession').value = s;
                    renderSessionButtons(sessions);
                };
                container.appendChild(btn);
            });
            document.getElementById('recordSession').value = selectedSession;
        }

        async function getLogs() {
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching data:', error);
                return [];
            }
        }

        function updateSubLocations() {
            const container = document.getElementById('subLocationContainer');
            const fridgeSelect = document.getElementById('fridgeName');
            const recorderContainer = document.getElementById('recorderContainer');
            
            fridgeSelect.innerHTML = '';

            if (selectedZone.includes('ห้องผลิต')) {
                container.classList.remove('hidden');
                fridgeSelect.setAttribute('required', 'required');

                let rooms = selectedZone === 'ห้องผลิตชั้นบน' ? ['1', '2', '3', '4', '5', '6'] : ['1', '2', '3'];
                rooms.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = `${selectedZone} ห้องที่ ${r}`;
                    opt.textContent = `ห้องที่ ${r}`;
                    fridgeSelect.appendChild(opt);
                });
            } else {
                container.classList.add('hidden');
                fridgeSelect.removeAttribute('required');
                const opt = document.createElement('option');
                opt.value = selectedZone;
                opt.textContent = selectedZone;
                fridgeSelect.appendChild(opt);
            }

            if (selectedZone === 'ห้องยาตึกใหม่') {
                recorderContainer.innerHTML = `
                    <select id="recorderName" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm font-medium">
                        <option value="" disabled selected>-- เลือกชื่อผู้บันทึก --</option>
                        <option value="ภัทราภรณ์">ภัทราภรณ์</option>
                        <option value="ณัชชา">ณัชชา</option>
                        <option value="เพ็ญลักษณ์">เพ็ญลักษณ์</option>
                    </select>
                `;
            } else {
                recorderContainer.innerHTML = `
                    <input type="text" id="recorderName" placeholder="เช่น ชื่อ-นามสกุล / ตำแหน่ง" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm font-medium">
                `;
            }

            updateSessions();
        }

        function updateSessions() {
            let sessions = ['รอบเช้า (09:00 น.)', 'รอบบ่าย (14:30 น.)'];
            if (selectedZone === 'ห้องยาตึกใหม่') {
                sessions = ['รอบเช้า (09:00 น.)', 'รอบบ่าย (14:30 น.)', 'เวรบ่าย (20:30 น.)'];
            } else if (selectedZone.includes('ห้องผลิต')) {
                sessions = ['รอบเช้า (09:00 น.)', 'รอบบ่าย (16:00 น.)'];
            }
            renderSessionButtons(sessions);
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>กำลังบันทึก...</span>';

            const date = document.getElementById('recordDate').value;
            const subLocation = document.getElementById('fridgeName').value;
            
            let targetSheetTab = selectedZone.includes('ห้องผลิต') ? 'ห้องผลิต' : selectedZone;
            let finalLocation = selectedZone.includes('ห้องผลิต') ? subLocation : selectedZone;

            const round = document.getElementById('recordSession').value;
            const fridgeTemp = parseFloat(document.getElementById('temperature').value);
            const roomTemp = parseFloat(document.getElementById('roomTemp').value);
            const humidity = parseInt(document.getElementById('humidity').value);
            const recorder = document.getElementById('recorderName').value;

            let status = 'ปกติ';
            if (fridgeTemp < 2.0 || fridgeTemp > 8.0) {
                status = 'ผิดปกติ';
            }

            const payload = {
                date,
                location: targetSheetTab,
                subLocation: finalLocation,
                round,
                fridgeTemp,
                roomTemp,
                humidity,
                status,
                recorder
            };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                alert('บันทึกข้อมูลสำเร็จเรียบร้อยครับ');
                document.getElementById('tempForm').reset();
                document.getElementById('recordDate').valueAsDate = new Date();
                selectedZone = 'ห้องยาตึกเก่า';
                renderZoneButtons();
                updateSubLocations();
                setTimeout(loadTable, 1500);
            } catch (error) {
                console.error('Error saving data:', error);
                alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่อีกครั้ง');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> <span>บันทึกข้อมูล</span>';
            }
        }

        async function exportCSV() {
            const logs = await getLogs();
            let csv = 'Date,Location,Round,FridgeTemp,RoomTemp,Humidity,Status,Recorder\n';
            logs.forEach(l => {
                csv += `${l.date},${l.location},${l.round},${l.fridgeTemp},${l.roomTemp},${l.humidity},${l.status},${l.recorder}\n`;
            });
            const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `chatturat_fridge_report_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        }

        async function loadTable() {
            const subLocation = document.getElementById('fridgeName').value;
            const targetCheck = selectedZone.includes('ห้องผลิต') ? subLocation : selectedZone;

            const allLogs = await getLogs();
            const logs = allLogs.filter(item => item.location === targetCheck || item.subLocation === targetCheck);

            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = '';

            if (logs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-slate-400">ยังไม่มีข้อมูลในสถานที่นี้</td></tr>`;
                return;
            }

            logs.forEach(item => {
                const tempVal = parseFloat(item.fridgeTemp);
                const isAbnormal = tempVal < 2.0 || tempVal > 8.0;
                const badgeClass = isAbnormal ? 'bg-rose-50 text-rose-600 border border-rose-200' : 'bg-emerald-50 text-emerald-600 border border-emerald-200';
                const statusText = isAbnormal ? 'ผิดปกติ' : 'ปกติ';

                let cleanDate = '';
                if (item.date) {
                    let d = String(item.date).split('T')[0];
                    let parts = d.split('-');
                    if (parts.length === 3) {
                        let thaiYear = parseInt(parts[0]) + 543;
                        let shortThaiYear = String(thaiYear).slice(2);
                        cleanDate = `${shortThaiYear}-${parts[1]}-${parts[2]}`;
                    } else {
                        cleanDate = d;
                    }
                }

                let displayLocation = item.subLocation || item.location;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition';
                tr.innerHTML = `
                    <td class="py-2.5 pr-2 font-medium text-slate-700">${cleanDate}<br><span class="text-[10px] text-slate-400">${item.round}</span></td>
                    <td class="py-2.5 pr-2 text-slate-600">${displayLocation}</td>
                    <td class="py-2.5 pr-2 font-bold ${isAbnormal ? 'text-rose-600' : 'text-slate-800'}">${item.fridgeTemp}°C</td>
                    <td class="py-2.5 pr-2 text-slate-600">${item.roomTemp}°C</td>
                    <td class="py-2.5 pr-2 text-slate-600">${item.humidity}%</td>
                    <td class="py-2.5 pr-2"><span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${badgeClass}">${statusText}</span></td>
                    <td class="py-2.5 pr-2 text-slate-500">${item.recorder}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Init load
        renderZoneButtons();
        updateSubLocations();
    </script>
</body>
</html>
