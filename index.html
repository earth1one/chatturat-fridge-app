<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CTRH PharmaTemp</title>

<!-- ตั้งค่าสำหรับ iOS (iPhone / iPad) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PharmaTemp">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<meta name="theme-color" content="#14275e">

<!-- ตั้งค่าสำหรับ Android (PWA Manifest) -->
<link rel="manifest" href="./manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function(){var t=null;try{t=localStorage.getItem("pt-theme")}catch(e){}
if(t!=="light"&&t!=="dark"){t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
document.documentElement.setAttribute("data-theme",t)})();
</script>
<style>
:root{
  --bg:#f0f4f9; --surface:#fff; --surface2:#f4f7fb; --line:#d8e2ec; --ink:#102a43; --muted:#486581;
  --acc:#1e3a8a; --accInk:#fff; --h1:#1e3a8a; --h2:#0b1a45; --track:#e3e9f2;
  --bad:#c62828; --badInk:#b71c1c; --badbg:#fdecec; --warn:#9a3412; --warnbg:#fff1e6;
  --okbg:#eaf0fb; --okline:#c3d4f7; --focus:rgba(30,58,138,.14);
  --shadow:0 10px 28px rgba(20,39,94,.12); --glass:rgba(255,255,255,.94);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0b1226; --surface:#151f3d; --surface2:#1c2a52; --line:#2a3a68; --ink:#f1f5fb; --muted:#a3b3cf;
  --acc:#7aa2ff; --accInk:#0b1226; --h1:#1e3a8a; --h2:#0b1a45; --track:#22305a;
  --bad:#ff7b7b; --badInk:#ff9b9b; --badbg:#3a1a22; --warn:#fdba74; --warnbg:#3a2614;
  --okbg:#172a5c; --okline:#2a4596; --focus:rgba(122,162,255,.22);
  --shadow:0 10px 28px rgba(0,0,0,.4); --glass:rgba(11,18,38,.92);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 "Anuphan",system-ui,sans-serif;transition:background .25s,color .25s}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
.app{max-width:480px;margin:0 auto;min-height:100vh}
.view{display:none;padding-bottom:calc(110px + var(--safe-b))}
.view.on{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cap{margin:20px 2px 10px;font-size:15px;font-weight:700;color:var(--muted)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* ---------- หน้าแรก ---------- */
.home-head{background:linear-gradient(160deg,var(--h1),var(--h2));color:#fff;padding:calc(18px + var(--safe-t)) 20px 64px}
.brand{display:flex;align-items:center;gap:12px}
.mark{flex:none;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.brand-t{flex:1;display:flex;flex-direction:column;line-height:1.25}
.brand-t small{font-size:13px;opacity:.85}
.brand-t b{font-size:18px}
.ib{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center}
.ico-sun{display:none}
[data-theme="dark"] .ico-sun{display:block}
[data-theme="dark"] .ico-moon{display:none}
.today{margin-top:14px;display:flex;flex-direction:column}
.today small{font-size:14px;opacity:.85}
.today b{font-size:26px;line-height:1.2}
.pcard{margin:-44px 16px 0;background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;position:relative}
.pcard-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pcard-top small{display:block;font-size:13px;color:var(--muted);font-weight:600}
.pcard-top b{font-size:20px}
.badge{flex:none;font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;background:var(--warnbg);color:var(--warn)}
.badge.ok{background:var(--okbg);color:var(--acc)}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .35s}
.ptext{font-size:14px;color:var(--muted)}
.ptext b{color:var(--ink)}
.shifts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:3px;background:var(--surface2);border:1px solid var(--line);border-radius:12px}
.shifts button{height:34px;border:0;border-radius:9px;background:none;color:var(--muted);font-size:13px;font-weight:600}
.shifts button[aria-pressed=true]{background:var(--acc);color:var(--accInk);font-weight:700}
.wrap{padding:0 16px}
.alert{display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;padding:12px 14px;border-radius:18px;background:var(--badbg);border:1.5px solid var(--bad);text-align:left}
.alert .ai{flex:none;width:36px;height:36px;border-radius:10px;background:var(--bad);display:grid;place-items:center;color:#fff}
.alert .at{flex:1;display:flex;flex-direction:column;min-width:0}
.alert .at b{font-size:15px;color:var(--badInk)}
.alert .at span{font-size:13px;color:var(--muted)}
.loc{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:10px;padding:14px 14px 14px 16px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);text-align:left;min-height:64px}
.loc .lt{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.loc .lt b{font-size:16px}
.loc .lt small{font-size:13px;color:var(--muted)}
.loc .bar{height:6px}
.loc .cnt{flex:none;font-size:14px;font-weight:700;color:var(--warn);min-width:40px;text-align:right}
.loc.done{background:var(--okbg);border-color:var(--okline)}
.loc .tick{flex:none;width:32px;height:32px;border-radius:99px;background:var(--acc);color:var(--accInk);display:grid;place-items:center}
.chev{flex:none;color:var(--muted)}
.idle{margin:4px 2px 0;font-size:13px;color:var(--muted);line-height:1.8}
.idlebtn{border:0;background:none;padding:4px 2px;color:var(--acc);font-size:13px;font-weight:600;text-decoration:underline}
.refresh{display:block;margin:6px auto 0;border:0;background:none;color:var(--muted);font-size:13px;padding:10px}

/* ---------- หน้าบันทึก ---------- */
.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(10px + var(--safe-t)) 12px 12px}
.tb-row{display:flex;align-items:center;gap:8px}
.back{flex:none;width:44px;height:44px;border-radius:12px;border:0;background:none;display:grid;place-items:center}
.tb-t{flex:1;display:flex;flex-direction:column;min-width:0}
.tb-t b{font-size:20px;line-height:1.25}
.tb-t small{font-size:13px;color:var(--muted)}
.pill{flex:none;height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);color:var(--acc);font-size:13px;font-weight:600}
.zchips{display:flex;gap:8px;overflow-x:auto;margin:12px -12px 0;padding:2px 12px 4px;scrollbar-width:none}
.zchips::-webkit-scrollbar{display:none}
.zchip{flex:none;min-height:46px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.zchip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--accInk);font-weight:700}
.zchip .ok{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:99px;background:var(--okbg);color:var(--acc);font-size:12px;font-weight:700}
.zchip[aria-pressed=true] .ok{background:rgba(255,255,255,.25);color:inherit}
.opts{display:none;margin-top:12px;padding:12px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);flex-direction:column;gap:10px}
.opts.on{display:flex}
.opts label{font-size:13px;font-weight:600;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--accInk);font-weight:700}
.chip.add{border-style:dashed;color:var(--muted);background:transparent}
.field{width:100%;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:0 14px;font-size:16px;height:48px}
.field:focus{outline:0;border-color:var(--acc)}
textarea.field{height:auto;min-height:56px;padding:12px 14px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:4px;padding:4px;margin-top:12px;background:var(--surface2);border-radius:14px}
.seg button{min-height:40px;border:0;border-radius:11px;background:none;color:var(--muted);font-size:14px;font-weight:600;line-height:1.2;padding:4px}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--accInk);font-weight:700}
.rec-body{padding:14px 16px 0}
.row{margin-bottom:10px;padding:10px 10px 10px 16px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);transition:border-color .2s,background .2s}
.row.out{background:var(--badbg);border-color:var(--bad)}
.row:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--focus)}
.row.out:focus-within{border-color:var(--bad)}
.rh{display:flex;align-items:center;gap:10px}
.rn{flex:1;display:flex;flex-direction:column;min-width:0}
.rn b{font-size:16px}
.rn small{font-size:12px;color:var(--muted)}
.st{font-weight:700}
.st.ok{color:var(--acc)} .st.bad{color:var(--badInk)}
.donetag{display:inline-block;margin-top:2px;font-size:11px;font-weight:600;color:var(--acc);background:var(--okbg);border-radius:8px;padding:1px 8px;width:max-content}
.box{display:flex;align-items:baseline;gap:4px;height:52px;padding:0 12px;border-radius:14px;background:var(--surface2);border:1.5px solid var(--line)}
.box input{width:66px;height:48px;border:0;background:transparent;text-align:right;font-size:24px;font-weight:700;padding:0;min-width:0}
.box input:focus{outline:0}
.box input::placeholder{color:var(--muted);opacity:.55}
.box span{font-size:13px;color:var(--muted);font-weight:600}
.box.out{border-color:var(--bad);background:var(--surface)}
.box.out input{color:var(--badInk)}
.sg{flex:none;width:44px;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;font-weight:700}
.room2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.room2 .box{justify-content:space-between}
.room2 .box em{font-style:normal;font-size:12px;color:var(--muted);align-self:center;flex:none}
.room2 .box input{flex:1;width:auto}
.row.done{background:var(--okbg);border-color:var(--okline)}
.row.done.out{background:var(--badbg);border-color:var(--bad)}
.dv{flex:none;font-size:16px;font-weight:700;color:var(--acc)}
.dv.bad{color:var(--badInk)}
.rmsg{margin:6px 0 0;font-size:13px;font-weight:600;color:var(--badInk);display:none}
.row.out .rmsg{display:block}
.notelab{display:block;margin:16px 2px 8px;font-size:14px;font-weight:700;color:var(--muted)}
.notelab.req{color:var(--badInk)}
.notelab.req+textarea{border-color:var(--bad)}

/* ---------- แถบล่าง ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 12px calc(8px + var(--safe-b))}
.tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:52px;color:var(--muted);font-size:12px;font-weight:600}
.tabbar button[aria-current=page]{color:var(--acc);font-weight:700}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px 16px calc(12px + var(--safe-b))}
.savebar.on{display:block}
.savebar .in{max-width:448px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.sb-info{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px;background:#1e7a46;margin-right:6px}
.dot.off{background:#b45309}
.save{height:56px;border:0;border-radius:18px;background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;font-size:17px;font-weight:700;box-shadow:var(--shadow)}
.save:active{transform:scale(.985)}
.save:disabled{background:var(--track);color:var(--muted);box-shadow:none;cursor:not-allowed}
.save.warn{background:var(--bad);color:#fff}
[data-theme="dark"] .save.warn{color:#2a0707}

/* ---------- หน้าประวัติ ---------- */
.hhead{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(14px + var(--safe-t)) 16px 12px}
.hh-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hh-row b{font-size:24px}
.sheetlink{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:600;text-decoration:none}
.hchips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.hchips::-webkit-scrollbar{display:none}
.hchips .chip{flex:none}
.hbody{padding:14px 16px 0}
.range{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.range button{height:36px;border:0;border-radius:9px;background:none;color:var(--muted);font-size:13px;font-weight:600}
.range button[aria-pressed=true]{background:var(--acc);color:var(--accInk);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;min-width:0}
.tile[aria-pressed=true]{border:2px solid var(--acc);padding:9.5px}
.tile small{font-size:12px;color:var(--muted)}
.tile b{font-size:20px;line-height:1.2}
.tile span{font-size:11px;font-weight:700;color:var(--acc)}
.tile span.bad{color:var(--badInk)}
.tile span.none{color:var(--muted);font-weight:600}
.ccard{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 12px 10px}
.ccard h2{margin:0;font-size:15px}
.ccard p{margin:2px 0 8px;font-size:12px;color:var(--muted)}
.cv{position:relative;height:260px}
.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:14px}
.hrow{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line)}
.hrow.bad{background:var(--badbg);border-color:var(--bad)}
.hrow .ht{flex:1;display:flex;flex-direction:column;min-width:0}
.hrow .ht b{font-size:15px}
.hrow .ht span{font-size:12px;color:var(--muted)}
.hrow .ht i{font-style:normal;font-size:12px;color:var(--ink)}
.hrow .hv{flex:none;font-size:18px;font-weight:700;color:var(--acc);text-align:right}
.hrow .hv.bad,.hrow .hv .bad{color:var(--badInk)}
.morebtn{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--acc);font-size:14px;font-weight:600;margin-top:4px}
.okmsg{padding:14px;border-radius:16px;background:var(--okbg);border:1.5px solid var(--okline);color:var(--acc);font-size:14px;font-weight:600;text-align:center}

/* ---------- แจ้งสถานะ ---------- */
.sync{position:fixed;left:50%;bottom:calc(128px + var(--safe-b));transform:translate(-50%,12px);z-index:50;max-width:calc(100% - 32px);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0}
.sync.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.sync.wait{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.sync.ok{background:var(--acc);color:var(--accInk)}
.sync.err{background:var(--badbg);color:var(--badInk);border:1.5px solid var(--bad)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:9999;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.on{opacity:1}
.modal{background:var(--surface);border:1.5px solid var(--line);padding:28px 24px;border-radius:24px;text-align:center;box-shadow:var(--shadow);max-width:320px;width:90%;transform:scale(.85);transition:transform .3s cubic-bezier(.175,.885,.32,1.275)}
.overlay.on .modal{transform:scale(1)}
.modal h2{margin:0 0 6px;font-size:22px;color:var(--acc)}
.modal p{margin:0;font-size:15px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">

<!-- ================= หน้าแรก: ภาพรวมวันนี้ ================= -->
<section class="view on" id="v-home" aria-label="ภาพรวมวันนี้">
  <div class="home-head">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg></div>
      <div class="brand-t"><small>โรงพยาบาลจัตุรัส</small><b>PharmaTemp</b></div>
      <button class="ib" type="button" id="theme" aria-label="สลับโหมดกลางวัน/กลางคืน">
        <svg class="ico-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ico-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <div class="today"><small id="h-weekday"></small><b id="h-date"></b></div>
  </div>

  <div class="pcard">
    <div class="pcard-top">
      <div><small>รอบตอนนี้</small><b id="h-shift"></b></div>
      <span class="badge" id="h-badge"></span>
    </div>
    <div class="bar" aria-hidden="true"><i id="h-bar" style="width:0"></i></div>
    <span class="ptext" id="h-ptext"></span>
    <div class="shifts" id="h-shifts" role="group" aria-label="เลือกรอบเวลา"></div>
  </div>

  <div class="wrap">
    <div id="h-alerts"></div>
    <p class="cap">จุดที่ต้องบันทึกรอบนี้</p>
    <div id="h-list"></div>
    <button class="refresh" type="button" id="h-refresh"></button>
  </div>
</section>

<!-- ================= หน้าบันทึก ================= -->
<section class="view" id="v-record" aria-label="บันทึกค่า">
  <div class="topbar">

<button class="sync" id="sync" type="button" aria-live="polite"></button>
<div class="overlay" id="overlay" aria-hidden="true"><div class="modal"><h2>เยี่ยมมาก!</h2><p id="ov-text">ขอบคุณที่ให้ความร่วมมือจ้า</p></div></div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyy6-_AJ12huC3Wq-aSXPHeY_JhGJidXIvts7VZj6Fb9XTX18Y0be-ST0u5UALLV2rjTg/exec";
const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/1OXD__jfv2o6cM8FyG5DzRFFqV3bajg5LoCEDnmjn1SA/edit?usp=sharing";

// ---------- ข้อมูลสถานที่ ----------
const ZONES = [
  ["ห้องยาตึกใหม่", ["ตู้เย็น", "ห้องยาหลัก", "Substock"]],
  ["ห้องยาตึกเก่า", ["ตู้เย็น", "ห้องหลัก", "Substock"]],
  ["คลังยา", [["ตู้เย็น", ["ตู้ T31", "ตู้ T32", "ตู้ TH1 (บน)", "ตู้ TH1 (ล่าง)", "ตู้ TV1"]], ["อุณหภูมิห้อง", ["R1", "R2", "R3", "R4"]]]],
  ["ห้องผลิตชั้นบน", ["ห้องผลิตชั้นบน"]],
  ["ห้องผลิตชั้นล่าง", ["ห้องผลิตชั้นล่าง"]]
];
const STAFF = { "ห้องยาตึกเก่า": ["ระพีพรรณ", "รณชัย"], "คลังยา": ["พงศ์พันธ์", "นาวิน"] };
const STAFF_DEFAULT = ["ภัทราภรณ์", "ณัชชา", "เพ็ญลักษณ์"];
const SHIFT_TIME = { "รอบเช้า": "09:00", "รอบบ่าย": "14:30", "รอบเย็น": "20:30" };
const SHIFT_ORDER = { "รอบเช้า": 0, "รอบบ่าย": 1, "รอบเย็น": 2 };
const ALL_SHIFTS = ["รอบเช้า", "รอบบ่าย", "รอบเย็น"];
const LIM = { f: { lo: 2, hi: 8 }, fz: { lo: -25, hi: -15 }, r: { lo: 15, hi: 30 }, h: { lo: 30, hi: 70 } };
const FIELD = { f: "fridgeTemp", r: "roomTemp", h: "humidity" };
const UNIT = { f: "°C", r: "°C", h: "%RH" };

const zname = z => ZONES[z][0];
const roundsOf = z => (zname(z) === "ห้องยาตึกเก่า" || zname(z) === "คลังยา") ? ["รอบเช้า", "รอบบ่าย"] : ALL_SHIFTS;
const tabsOf = z => { const L = ZONES[z][1]; return Array.isArray(L[0]) ? L.map(c => ({ label: c[0], subs: c[1] })) : L.map(s => ({ label: s, subs: [s] })); };
const pointsOf = z => tabsOf(z).flatMap(t => t.subs);
const staffOf = z => STAFF[zname(z)] || STAFF_DEFAULT;
const isFridge = s => String(s).includes("ตู้");
const isFreezer = s => String(s).includes("TH1 (บน)");
const KNOWN_SUBS = new Set(ZONES.flatMap((z, i) => pointsOf(i)));

// ---------- เครื่องมือทั่วไป ----------
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const root = document.documentElement;
const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const clockShift = () => { const h = new Date().getHours(); return h < 12 ? "รอบเช้า" : h < 18 ? "รอบบ่าย" : "รอบเย็น"; };
const dayOf = v => String(v ?? "").slice(0, 10);
const toDate = v => { const s = dayOf(v); return /^\d{4}-\d\d-\d\d$/.test(s) ? new Date(s + "T00:00") : new Date(v); };
const fmtShort = v => { const d = toDate(v); return isNaN(d) ? String(v ?? "") : `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${String(d.getFullYear()).slice(-2)}`; };
const fmtThai = v => toDate(v).toLocaleDateString("th-TH", { day: "numeric", month: "long", year: "numeric" });
const fmtThaiShort = v => toDate(v).toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "numeric" });
const timeOf = ts => { const d = new Date(ts); return isNaN(d) ? "" : `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const numOf = v => (v === "" || v == null || isNaN(parseFloat(v))) ? null : parseFloat(v);
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const badVal = (k, v, sub) => { if (v == null || isNaN(v)) return false; const L = k === "f" ? (isFreezer(sub) ? LIM.fz : LIM.f) : LIM[k]; return v < L.lo || v > L.hi; };

// ข้อมูลเก่าบางแถวบันทึกชื่อคนไว้ในช่อง SubLocation: จัดกลุ่มให้ถูกตอนแสดงผล
function subLabel(r, key) {
  const s = String(r.subLocation || "").trim();
  if (s && KNOWN_SUBS.has(s) && (key === "f") === isFridge(s)) return s;
  if (key === "f") return r.location === "คลังยา" ? "ไม่ระบุตู้ (ข้อมูลเก่า)" : "ตู้เย็น";
  return "ห้อง (ข้อมูลเก่า)";
}

// ---------- สถานะ ----------
let view = "home";
let homeShift = clockShift();
let zone = Math.min(ZONES.length - 1, Math.max(0, +ls.get("pt-zone", 0) || 0));
let tab = 0, recDate = todayStr(), recShift = homeShift;
let cachedHistory = [], lastLoad = 0, loading = false, loadError = "";
const sessionRows = [];          // แถวที่บันทึกในเครื่องนี้ (ก่อนชีตยืนยัน)
const drafts = {};               // ค่าที่กรอกค้างไว้ ไม่หายเวลาสลับแท็บ
const reopened = new Set();      // จุดที่บันทึกแล้วแต่ผู้ใช้กด "แก้ไข" เพื่อบันทึกใหม่
let who = "";
let hLoc = 0, hDays = 7, hMetric = null, showAll = false, chart = null;

// ---------- คิวส่งข้อมูล (บันทึกเร็ว ไม่หาย ไม่ซ้ำ) ----------
const OUTBOX_KEY = "pt-outbox";
let outboxMem = [];
const loadOutbox = () => { try { return JSON.parse(localStorage.getItem(OUTBOX_KEY) || "[]"); } catch (e) { return outboxMem; } };
const saveOutbox = q => { outboxMem = q; try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(q)); } catch (e) {} };
let flushing = false, retryTimer = null, pillTimer = null;

function showSync(state, n) {
  const el = $("#sync");
  clearTimeout(pillTimer);
  el.className = "sync on " + state;
  el.textContent = state === "wait" ? `กำลังส่งเข้าชีต ${n} รายการ...`
                 : state === "err" ? `ยังส่งไม่สำเร็จ ${n} รายการ · แตะเพื่อลองใหม่`
                 : "✓ บันทึกเข้าชีตเรียบร้อย";
  if (state === "ok") pillTimer = setTimeout(() => el.classList.remove("on"), 2500);
}
async function flushOutbox() {
  if (flushing) return;
  let q = loadOutbox();
  if (!q.length) return;
  flushing = true; clearTimeout(retryTimer);
  showSync("wait", q.reduce((s, it) => s + it.rows.length, 0));
  let failed = false;
  while (q.length) {
    const item = q[0];
    try {
      const res = await fetch(APPS_SCRIPT_URL, { method: "POST", body: JSON.stringify({ id: item.id, rows: item.rows }) });
      const j = await res.json();
      if (j.status !== "success") throw new Error(j.message || "server");
      q = loadOutbox().filter(it => it.id !== item.id); saveOutbox(q);
      const t = Date.now(); sessionRows.forEach(r => { if (r._id === item.id) r._sentAt = t; });
    } catch (err) { failed = true; break; }
  }
  flushing = false;
  if (failed) {
    showSync("err", loadOutbox().reduce((s, it) => s + it.rows.length, 0));
    retryTimer = setTimeout(flushOutbox, 20000);       // ลองใหม่อัตโนมัติทุก 20 วินาที
  } else {
    showSync("ok");
    setTimeout(() => loadData(true), 1500);           // ดึงสถานะล่าสุดจากชีต
  }
  refreshNet();
}

// ---------- โหลดข้อมูลจากชีต ----------
async function loadData(force) {
  if (loading || (!force && Date.now() - lastLoad < 60000)) return;
  loading = true; loadError = ""; renderRefresh();
  const started = Date.now();
  try {
    const res = await fetch(APPS_SCRIPT_URL);
    const j = await res.json();
    if (!Array.isArray(j)) throw new Error("รูปแบบข้อมูลไม่ถูกต้อง");
    cachedHistory = j; lastLoad = Date.now();
    // แถวที่ส่งเข้าชีตสำเร็จก่อนเริ่มโหลด อยู่ในข้อมูลชีตแล้ว ไม่ต้องนับซ้ำ
    for (let i = sessionRows.length - 1; i >= 0; i--) if (sessionRows[i]._sentAt && sessionRows[i]._sentAt < started) sessionRows.splice(i, 1);
  } catch (e) { loadError = e.message || "เชื่อมต่อไม่ได้"; }
  loading = false;
  if (view === "home") renderHome();
  else if (view === "history") renderHistory();
  else if (view === "record") { renderTabs(); refreshDoneTags(); renderZoneChecks(); }
  renderRefresh();
}

// แถวทั้งหมดที่รู้ตอนนี้: จากชีต + ที่ค้างส่ง + ที่เพิ่งบันทึก
function knownRows() {
  const out = cachedHistory.slice();
  const q = loadOutbox(), pendingIds = new Set(q.map(it => it.id)), sessIds = new Set(sessionRows.map(r => r._id));
  // ที่เพิ่งบันทึกในเครื่องนี้ (ยังไม่อยู่ในข้อมูลชีตที่โหลดล่าสุด)
  sessionRows.forEach(r => out.push({ ...r, _pending: pendingIds.has(r._id) }));
  // ที่ค้างส่งจากการเปิดแอปครั้งก่อน
  q.forEach(it => { if (!sessIds.has(it.id)) it.rows.forEach(r => out.push({ ...r, timestamp: it.ts || "", _pending: true })); });
  return out;
}
function doneMap(date, shift) {
  const m = new Map();
  knownRows().forEach(r => {
    if (dayOf(r.date) !== date || r.shift !== shift) return;
    const k = r.location + "|" + r.subLocation, prev = m.get(k);
    if (!prev || String(r.timestamp || "") > String(prev.ts || "")) m.set(k, { who: r.who, ts: r.timestamp || "", row: r });
  });
  return m;
}

// ---------- สลับหน้า ----------
function showView(v) {
  view = v;
  ["home", "record", "history"].forEach(n => $("#v-" + n).classList.toggle("on", n === v));
  $("#tabbar").style.display = v === "record" ? "none" : "block";
  $("#savebar").classList.toggle("on", v === "record");
  document.querySelectorAll("#tabbar button").forEach(b => { if (b.dataset.go === v) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  scrollTo({ top: 0 });
  if (v === "home") { renderHome(); loadData(false); }
  if (v === "history") { renderHistory(); loadData(false); }
}
$("#tabbar").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.go === "record") openRecord(zone);
  else showView(b.dataset.go);
});

// ---------- หน้าแรก ----------
// สถานที่ที่ไม่มีการบันทึกเลยใน 14 วันล่าสุด ถือว่าไม่ได้ใช้งาน (ไม่นับเป็นจุดค้าง)
function activeZones() {
  if (!lastLoad) return new Set(ZONES.map((z, i) => i));
  const from = toDate(todayStr()).getTime() - 13 * 864e5;
  const seen = new Set(knownRows().filter(r => toDate(r.date).getTime() >= from).map(r => String(r.location || "").trim()));
  return new Set(ZONES.map((z, i) => i).filter(i => seen.has(zname(i))));
}
function zonesForShift(s) { const act = activeZones(); return ZONES.map((z, i) => i).filter(i => roundsOf(i).includes(s) && act.has(i)); }
function idleZonesForShift(s) { const act = activeZones(); return ZONES.map((z, i) => i).filter(i => roundsOf(i).includes(s) && !act.has(i)); }
function firstPendingZone() {
  const dm = doneMap(todayStr(), homeShift);
  const zs = zonesForShift(homeShift);
  if (zs.includes(zone) && pointsOf(zone).some(s => !dm.has(zname(zone) + "|" + s))) return zone;
  return zs.find(i => pointsOf(i).some(s => !dm.has(zname(i) + "|" + s))) ?? null;
}
function renderHome() {
  const t = todayStr(), now = new Date();
  $("#h-weekday").textContent = now.toLocaleDateString("th-TH", { weekday: "long" });
  $("#h-date").textContent = fmtThai(t);
  $("#h-shift").textContent = `${homeShift} · ${SHIFT_TIME[homeShift]} น.`;
  $("#h-shifts").innerHTML = ALL_SHIFTS.map(s => `<button type="button" data-s="${s}" aria-pressed="${s === homeShift}">${s.replace("รอบ", "")} ${SHIFT_TIME[s]}</button>`).join("");

  const dm = doneMap(t, homeShift);
  let total = 0, done = 0;
  const items = zonesForShift(homeShift).map(i => {
    const pts = pointsOf(i), d = pts.filter(s => dm.has(zname(i) + "|" + s));
    total += pts.length; done += d.length;
    const last = d.map(s => dm.get(zname(i) + "|" + s)).sort((a, b) => String(b.ts).localeCompare(String(a.ts)))[0];
    return { i, n: pts.length, d: d.length, last };
  });
  items.sort((a, b) => (a.d === a.n) - (b.d === b.n));
  const idle = idleZonesForShift(homeShift);
  const idleHtml = idle.length ? `<p class="idle">ไม่ได้บันทึกมา 14 วัน (ไม่นับรวม): ${idle.map(i => `<button type="button" class="idlebtn" data-z="${i}">${esc(zname(i))}</button>`).join(" · ")}</p>` : "";
  $("#h-list").innerHTML = items.map(it => {
    if (it.d === it.n) {
      const info = it.last ? `ครบแล้ว · ${esc(it.last.who || "")}${it.last.ts ? " " + timeOf(it.last.ts) + " น." : ""}` : "ครบแล้ว";
      return `<button type="button" class="loc done" data-z="${it.i}"><span class="lt"><b>${esc(zname(it.i))}</b><small>${info}</small></span><span class="tick" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>`;
    }
    return `<button type="button" class="loc" data-z="${it.i}"><span class="lt"><b>${esc(zname(it.i))}</b><span class="bar" aria-hidden="true"><i style="width:${Math.round(it.d / it.n * 100)}%"></i></span></span><span class="cnt">${it.d}/${it.n}</span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>`;
  }).join("") + idleHtml;

  const left = total - done;
  $("#h-badge").textContent = left ? `เหลือ ${left} จุด` : "ครบทุกจุด";
  $("#h-badge").classList.toggle("ok", !left);
  $("#h-bar").style.width = (total ? done / total * 100 : 0) + "%";
  $("#h-ptext").innerHTML = `บันทึกแล้ว <b>${done}</b> จาก ${total} จุด`;

  // ค่านอกเกณฑ์วันนี้
  const bads = [];
  knownRows().filter(r => dayOf(r.date) === t).forEach(r => ["f", "r", "h"].forEach(k => {
    const v = numOf(r[FIELD[k]]);
    if (v !== null && badVal(k, v, subLabel(r, k))) bads.push({ r, k, v });
  }));
  if (bads.length) {
    const b = bads[bads.length - 1];
    const more = bads.length > 1 ? ` และอีก ${bads.length - 1} รายการ` : "";

const parseIn = v => { const s = String(v).replace(",", ".").replace(/[−–]/g, "-").trim(); const n = parseFloat(s); return s === "" || isNaN(n) ? null : n; };

    const s = stat[k];
    const tag = !s.n ? `<span class="none">ไม่มีข้อมูล</span>` : s.bad ? `<span class="bad">เกิน ${s.bad} ครั้ง</span>` : `<span>ปกติทั้งหมด</span>`;
    return `<button type="button" class="tile" data-m="${k}" aria-pressed="${k === hMetric}"><small>${METRIC_SHORT[k]}</small><b>${s.n ? (s.n - s.bad) + "/" + s.n : "–"}</b>${tag}</button>`;
  }).join("");
  $("#hc-title").textContent = METRIC_TITLE[hMetric];
  if (chart) { chart.destroy(); chart = null; }
  const wrap = $("#hc-wrap");
  if (!stat[hMetric].n) { wrap.style.display = "none"; }
  else if (typeof Chart === "undefined") { wrap.style.display = "block"; wrap.innerHTML = `<div class="empty">โหลดกราฟไม่ได้ ตรวจสอบอินเทอร์เน็ต</div>`; }
  else {
    wrap.style.display = "block";
    if (!$("#hc")) wrap.innerHTML = `<canvas id="hc" role="img" aria-label="กราฟข้อมูลย้อนหลัง"></canvas>`;
    chart = mk($("#hc"), hMetric, rows);
  }

  // ค่านอกเกณฑ์ (ใหม่สุดก่อน)
  const bads = [];
  rows.slice().reverse().forEach(r => ["f", "r", "h"].forEach(k => { const v = numOf(r[FIELD[k]]); if (v !== null && badVal(k, v, subLabel(r, k))) bads.push({ r, k, v }); }));
  $("#hb").innerHTML = bads.length ? bads.map(({ r, k, v }) => `<div class="hrow bad"><div class="ht"><b>${esc(subLabel(r, k))}</b><span>${fmtShort(r.date)} ${esc(r.shift || "")} · ${esc(r.who || "-")}</span>${r.note ? `<i>หมายเหตุ: ${esc(r.note)}</i>` : `<i style="color:var(--badInk)">ไม่มีหมายเหตุ</i>`}</div><span class="hv bad">${v} ${k === "h" ? "%" : "°C"}</span></div>`).join("")
    : `<div class="okmsg">ไม่มีค่านอกเกณฑ์ในช่วงนี้</div>`;

  // รายการทั้งหมด
  const all = rows.slice().reverse();
  $("#hmore").style.display = all.length ? "block" : "none";
  $("#hmore").textContent = showAll ? "ซ่อนรายการทั้งหมด" : `ดูรายการทั้งหมด (${all.length})`;
  $("#ha-cap").style.display = showAll && all.length ? "block" : "none";
  $("#ha").innerHTML = showAll ? all.slice(0, 200).map(r => {
    const parts = ["f", "r", "h"].map(k => { const v = numOf(r[FIELD[k]]); if (v === null) return ""; const b = badVal(k, v, subLabel(r, k)); return `<span class="${b ? "bad" : ""}">${v}${k === "h" ? "%" : "°"}</span>`; }).filter(Boolean);
    const anyBad = ["f", "r", "h"].some(k => { const v = numOf(r[FIELD[k]]); return v !== null && badVal(k, v, subLabel(r, k)); });
    const k0 = numOf(r.fridgeTemp) !== null ? "f" : "r";
    return `<div class="hrow${anyBad ? " bad" : ""}"><div class="ht"><b>${esc(subLabel(r, k0))}</b><span>${fmtShort(r.date)} ${esc(r.shift || "")} ${SHIFT_TIME[r.shift] || ""} · ${esc(r.who || "-")}${r._pending ? " · รอส่ง" : ""}</span>${r.note ? `<i>หมายเหตุ: ${esc(r.note)}</i>` : ""}</div><span class="hv">${parts.join(" · ")}</span></div>`;
  }).join("") + (all.length > 200 ? `<div class="empty">แสดง 200 รายการล่าสุด ดูทั้งหมดได้ในชีต</div>` : "") : "";
}
$("#hz").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; hLoc = +b.dataset.z; showAll = false; hMetric = null; renderHistory(); });
$("#hr").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; hDays = +b.dataset.d; renderHistory(); });
$("#ht").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; hMetric = b.dataset.m; renderHistory(); });
$("#hmore").addEventListener("click", () => { showAll = !showAll; renderHistory(); });

// กราฟ: แยกเส้นรายตู้/จุดวัด + แถบช่วงปกติ
const SERIES_COLORS = ["#1e40af", "#0891b2", "#7c3aed", "#db2777", "#059669", "#d97706", "#4f46e5", "#0d9488"];
const bandPlugin = {
  id: "normalBand",
  beforeDatasetsDraw(c, args, opts) {
    const { ctx, chartArea: a, scales: { y } } = c;
    if (!a || !opts || !opts.bands) return;
    ctx.save(); ctx.fillStyle = opts.color;
    opts.bands.forEach(([lo, hi]) => { const top = y.getPixelForValue(Math.min(hi, y.max)), bot = y.getPixelForValue(Math.max(lo, y.min)); if (bot > top) ctx.fillRect(a.left, top, a.right - a.left, bot - top); });
    ctx.restore();
  }
};
function mk(canvas, key, R) {
  const fld = FIELD[key], unit = UNIT[key];
  const rows = R.filter(r => numOf(r[fld]) !== null);
  const hasFreezer = key === "f" && rows.some(r => numOf(r[fld]) < 0 || isFreezer(subLabel(r, key)));
  const [min, max] = key === "f" ? [hasFreezer ? -30 : 0, 12] : key === "r" ? [10, 40] : [20, 80];
  const bands = key === "f" ? (hasFreezer ? [[2, 8], [-25, -15]] : [[2, 8]]) : key === "r" ? [[15, 30]] : [[30, 70]];
  const color = key === "f" ? "#1e40af" : key === "r" ? "#d97706" : "#0284c7";
  const slotKey = r => `${dayOf(r.date)}|${r.shift || ""}`;
  const slots = [], seen = new Set();
  rows.forEach(r => { const k = slotKey(r); if (!seen.has(k)) { seen.add(k); slots.push({ k, date: r.date, shift: r.shift || "" }); } });
  slots.sort((a, b) => (toDate(a.date) - toDate(b.date)) || ((SHIFT_ORDER[a.shift] ?? 9) - (SHIFT_ORDER[b.shift] ?? 9)));
  const idx = new Map(slots.map((s, i) => [s.k, i]));
  const lab = slots.map(s => `${fmtShort(s.date)} ${s.shift}`);
  const shapeOf = s => s === "รอบเช้า" ? "circle" : s === "รอบบ่าย" ? "rect" : "rectRot";
  const names = [...new Set(rows.map(r => subLabel(r, key)))];
  const bad = css("--bad");
  const datasets = names.map((name, si) => {
    const col = names.length === 1 ? color : SERIES_COLORS[si % SERIES_COLORS.length];
    const pts = new Array(slots.length).fill(null);
    rows.filter(r => subLabel(r, key) === name).forEach(r => { pts[idx.get(slotKey(r))] = r; });
    const raw = pts.map(r => r ? numOf(r[fld]) : null);
    const isBad = i => raw[i] !== null && badVal(key, raw[i], name);
    return {
      label: name, _rows: pts, _raw: raw,
      data: raw.map(v => v === null ? null : Math.max(min, Math.min(max, v))),
      borderColor: col, backgroundColor: col, borderWidth: 2, tension: .25, spanGaps: true,
      pointStyle: c => (raw[c.dataIndex] !== null && (raw[c.dataIndex] < min || raw[c.dataIndex] > max)) ? "triangle" : shapeOf(slots[c.dataIndex].shift),
      rotation: c => (raw[c.dataIndex] !== null && raw[c.dataIndex] < min) ? 180 : 0,
      pointRadius: c => raw[c.dataIndex] === null ? 0 : isBad(c.dataIndex) ? 6 : (slots.length <= 20 ? 3 : 1.5),
      pointHoverRadius: 7,
      pointBackgroundColor: c => isBad(c.dataIndex) ? bad : col,
      pointBorderColor: c => isBad(c.dataIndex) ? bad : col
    };
  });
  Chart.defaults.font.family = '"Anuphan",system-ui,sans-serif';
  return new Chart(canvas, {
    type: "line", data: { labels: lab, datasets }, plugins: [bandPlugin],
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: "nearest", intersect: false, axis: "x" },
      plugins: {
        normalBand: { bands, color: root.getAttribute("data-theme") === "dark" ? "rgba(122,162,255,.12)" : "rgba(30,58,138,.08)" },
        legend: { display: names.length > 1, position: "bottom", labels: { color: css("--ink"), boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: "circle", padding: 10, font: { size: 12 } } },
        tooltip: { callbacks: {
          title: it => lab[it[0].dataIndex],
          label: c => { const ds = c.dataset, v = ds._raw[c.dataIndex], r = ds._rows[c.dataIndex]; if (v === null) return null; return `${ds.label}: ${v} ${unit}${badVal(key, v, ds.label) ? " ⚠ ผิดปกติ" : ""}${r && r.who ? " · " + r.who : ""}`; }
        } }
      },
      scales: {
        y: { min, max, grid: { color: css("--line") }, ticks: { color: css("--muted") } },
        x: { grid: { display: false }, ticks: { color: css("--muted"), maxRotation: 0, autoSkip: true, maxTicksLimit: 6, callback(v) { return lab[v] ? lab[v].split(" ")[0] : ""; } } }
      }
    }
  });
}
new MutationObserver(() => { if (view === "history") renderHistory(); }).observe(root, { attributes: true, attributeFilter: ["data-theme"] });

// ---------- กลับมาเปิดแอป: วันที่/รอบเป็นปัจจุบัน ส่งคิวค้าง และโหลดสถานะใหม่ ----------
let lastActive = Date.now(), lastDay = todayStr();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") { lastActive = Date.now(); return; }
  const away = Date.now() - lastActive;
  if (todayStr() !== lastDay || away > 30 * 60 * 1000) {
    const dayChanged = todayStr() !== lastDay;
    lastDay = todayStr(); homeShift = clockShift();
    if (view === "record" && dayChanged) { recDate = todayStr(); const rs = roundsOf(zone); recShift = rs.includes(homeShift) ? homeShift : rs[rs.length - 1]; renderRecord(); }
    if (view === "home") renderHome();
  }
  flushOutbox();
  loadData(away > 2 * 60 * 1000);
});
$("#sync").addEventListener("click", flushOutbox);

// ---------- เริ่มต้น ----------
renderHome();
loadData(true);
flushOutbox();
</script>
</body>
</html>
