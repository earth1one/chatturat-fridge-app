<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกอุณหภูมิตู้เย็น</title>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>บันทึกอุณหภูมิ</h2>
    <form id="tempForm">
        <div class="form-group">
            <label>วันที่</label>
            <input type="text" id="date" required>
        </div>
        <div class="form-group">
            <label>ห้อง / โซน (Location)</label>
            <input type="text" id="location" value="ห้องยาตึกเก่า" required>
        </div>
        <div class="form-group">
            <label>จุดย่อย (Sub Location)</label>
            <input type="text" id="subLocation" placeholder="เช่น ตู้เย็นช่อง 1">
        </div>
        <div class="form-group">
            <label>รอบการบันทึก</label>
            <select id="round">
                <option value="รอบเช้า (09:00 น.)">รอบเช้า (09:00 น.)</option>
                <option value="รอบบ่าย (14:30 น.)">รอบบ่าย (14:30 น.)</option>
                <option value="รอบค่ำ (20:30 น.)">รอบค่ำ (20:30 น.)</option>
            </select>
        </div>
        <div class="form-group">
            <label>อุณหภูมิตู้เย็น (°C)</label>
            <input type="number" step="0.1" id="fridgeTemp">
        </div>
        <div class="form-group">
            <label>ความชื้นตู้เย็น (%)</label>
            <input type="number" step="0.1" id="fridgeHumidity">
        </div>
        <div class="form-group">
            <label>อุณหภูมิห้อง (°C)</label>
            <input type="number" step="0.1" id="roomTemp">
        </div>
        <div class="form-group">
            <label>ความชื้นห้อง (%)</label>
            <input type="number" step="0.1" id="humidity">
        </div>
        <div class="form-group">
            <label>สถานะ</label>
            <select id="status">
                <option value="ปกติ">ปกติ</option>
                <option value="ผิดปกติ">ผิดปกติ</option>
            </select>
        </div>
        <div class="form-group">
            <label>ผู้บันทึก</label>
            <input type="text" id="recorder" required>
        </div>
        <div class="form-group">
            <label>หมายเหตุ</label>
            <textarea id="note" rows="2"></textarea>
        </div>
        <button type="submit">บันทึกข้อมูล</button>
    </form>
</div>

<script>
    // เชื่อมต่อกับ Google Apps Script Web App URL ล่าสุดของคุณ
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzhpIFeil5EDBn5NQkKkQkW31aJy7c1Guju0tx9TpzPP6WomDxOnKqVb3KSmdqNRvTtNQ/exec";

    // กำหนดวันที่ปัจจุบันในรูปแบบ YYYY-MM-DD อัตโนมัติ
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    document.getElementById('date').value = `${year}-${month}-${day}`;

    document.getElementById('tempForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const formData = {
            date: document.getElementById('date').value,
            location: document.getElementById('location').value,
            subLocation: document.getElementById('subLocation').value,
            round: document.getElementById('round').value,
            fridgeTemp: document.getElementById('fridgeTemp').value,
            fridgeHumidity: document.getElementById('fridgeHumidity').value,
            roomTemp: document.getElementById('roomTemp').value,
            humidity: document.getElementById('humidity').value,
            status: document.getElementById('status').value,
            recorder: document.getElementById('recorder').value,
            note: document.getElementById('note').value
        };

        try {
            let response = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(formData),
                headers: {
                    "Content-Type": "text/plain;charset=utf-8",
                },
            });
            let result = await response.json();
            if(result.status === "success") {
                alert("บันทึกข้อมูลสำเร็จ!");
                document.getElementById('tempForm').reset();
                document.getElementById('date').value = `${year}-${month}-${day}`;
            } else {
                alert("เกิดข้อผิดพลาด: " + result.message);
            }
        } catch (error) {
            console.error("Error:", error);
            alert("ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้");
        }
    });
</script>

</body>
</html>
