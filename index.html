<script>
document.addEventListener("DOMContentLoaded", function() {
  var WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxnr4PPciPSLN34BnY-gL-jBK0jUT3G0BB7fYQugiP-wA_OvCQAbqBvADs706wMeatlcw/exec";
  var ZONES = ["ห้องยาตึกใหม่", "ห้องยาตึกเก่า", "คลังยา", "ห้องผลิตชั้นบน", "ห้องผลิตชั้นล่าง"];
  var ROUNDS_DEFAULT = [{id:"am", n:"รอบเช้า", t:"09:00 น."}, {id:"pm", n:"รอบบ่าย", t:"14:30 น."}];
  var ROUNDS_NEW = [{id:"am", n:"รอบเช้า", t:"09:00 น."}, {id:"pm", n:"รอบบ่าย", t:"14:30 น."}, {id:"eve", n:"เวรบ่าย", t:"20:30 น."}];
  var ROUNDS_PROD = [{id:"am", n:"รอบเช้า", t:"09:00 น."}, {id:"pm", n:"รอบบ่าย", t:"16:00 น."}];

  var WAREHOUSE_FRIDGES = ["T31", "T32", "TH1", "TV1"];
  var warehouseData = { 
    "T31": {temp: "", hum: ""}, 
    "T32": {temp: "", hum: ""}, 
    "TH1": {temp: "", hum: ""}, 
    "TV1": {temp: "", hum: ""} 
  };
  var activeWarehouseFridge = "T31";

  var S = { zone: ZONES[0], round: "am" };
  var windowRemoteLogs = [];

  function $(i) { return document.getElementById(i); }

  function getActiveRounds() {
    if (S.zone === "ห้องยาตึกใหม่") return ROUNDS_NEW;
    if (S.zone.includes("ห้องผลิต")) return ROUNDS_PROD;
    return ROUNDS_DEFAULT;
  }

  function drawZones() {
    var h = $("zones"); if (!h) return; h.innerHTML = "";
    ZONES.forEach(function(z) {
      var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = z;
      b.setAttribute("aria-pressed", z === S.zone);
      b.onclick = function() {
        S.zone = z;
        var rList = getActiveRounds();
        if (!rList.some(function(r) { return r.id === S.round; })) { S.round = rList[0].id; }
        drawZones();
        updateSubZoneField();
        updateWarehouseField();
        updateWhoField();
        updateFormVisibility();
        drawRounds();
      };
      h.appendChild(b);
    });
  }

  function updateFormVisibility() {
    var subSel = $("subZoneSelect");
    var isSubStock = subSel && subSel.value.includes("substock");
    var fridgeCard = $("fridgeCardSection");
    var roomCard = $("roomCardSection");
    var whoSelect = $("who");
    var selectedWho = whoSelect ? whoSelect.value : "";

    if (S.zone === "ห้องยาตึกใหม่" && selectedWho) {
      if (selectedWho === "ภัทราภรณ์") {
        if (fridgeCard) fridgeCard.style.display = "block";
        if (roomCard) roomCard.style.display = "none";
        if ($("measuredTitle")) $("measuredTitle").textContent = "ค่าที่วัดได้ (เฉพาะตู้เย็น)";
      } else if (selectedWho === "ณัชชา" || selectedWho === "เพ็ญลักษณ์") {
        if (fridgeCard) fridgeCard.style.display = "none";
        if (roomCard) roomCard.style.display = "block";
        if ($("measuredTitle")) $("measuredTitle").textContent = isSubStock ? "ค่าที่วัดได้ (ห้อง Substock)" : "ค่าที่วัดได้ (ห้องยา)";
      }
    } else {
      if (isSubStock) {
        if (fridgeCard) fridgeCard.style.display = "none";
        if (roomCard) roomCard.style.display = "block";
        if ($("measuredTitle")) $("measuredTitle").textContent = "ค่าที่วัดได้ (ห้อง Substock)";
      } else {
        if (fridgeCard) fridgeCard.style.display = "block";
        if (roomCard) roomCard.style.display = "block";
        if ($("measuredTitle")) $("measuredTitle").textContent = "ค่าที่วัดได้";
      }
    }
  }

  function drawRounds() {
    var h = $("rounds"); if (!h) return; h.innerHTML = "";
    var activeRounds = getActiveRounds();
    activeRounds.forEach(function(r) {
      var currentLoc = S.zone.includes("ห้องผลิต") || S.zone.includes("ห้องยา") && $("subZoneSelect") ? $("subZoneSelect").value : S.zone;
      var done = windowRemoteLogs.some(function(m) {
        var itemLoc = m.subLocation || m.location;
        return m.date === $("date").value && itemLoc === currentLoc && m.round && m.round.includes(r.n);
      });
      var b = document.createElement("button"); b.type = "button"; b.className = done ? "done" : "";
      b.setAttribute("aria-pressed", r.id === S.round);
      b.innerHTML = "<b>" + r.n + "</b><span>" + (done ? "✓ บันทึกแล้ว" : r.t) + "</span>";
      b.onclick = function() { S.round = r.id; drawRounds(); };
      h.appendChild(b);
    });
  }

  function updateSubZoneField() {
    var wrap = $("subZoneField");
    var sel = $("subZoneSelect");
    if (!wrap || !sel) return;
    sel.innerHTML = "";
    
    if (S.zone.includes("ห้องผลิต")) {
      wrap.style.display = "block";
      if ($("subZoneLabel")) $("subZoneLabel").textContent = "ระบุหมายเลขห้องผลิต";
      var rooms = S.zone === "ห้องผลิตชั้นบน" ? ['1', '2', '3', '4', '5', '6'] : ['1', '2', '3'];
      rooms.forEach(function(r) {
        var opt = document.createElement("option");
        opt.value = S.zone + " ห้องที่ " + r;
        opt.textContent = "ห้องที่ " + r;
        sel.appendChild(opt);
      });
    } else if (S.zone === "ห้องยาตึกใหม่" || S.zone === "ห้องยาตึกเก่า") {
      wrap.style.display = "block";
      if ($("subZoneLabel")) $("subZoneLabel").textContent = "เลือกพื้นที่ใน" + S.zone;
      var optMain = document.createElement("option");
      optMain.value = S.zone;
      optMain.textContent = S.zone + " (หลัก)";
      sel.appendChild(optMain);
      var optSub = document.createElement("option");
      optSub.value = S.zone + " (substock)";
      optSub.textContent = S.zone + " - substock";
      sel.appendChild(optSub);
    } else {
      wrap.style.display = "none";
    }
    updateFormVisibility();
  }

  function updateWarehouseField() {
    var wrap = $("warehouseFridgesField");
    if (!wrap) return;
    if (S.zone === "คลังยา") {
      wrap.style.display = "block";
      drawWarehouseFridges();
    } else {
      wrap.style.display = "none";
    }
  }

  function drawWarehouseFridges() {
    var grid = $("warehouseFridges");
    if (!grid) return;
    grid.innerHTML = "";
    var filledCount = 0;
    
    WAREHOUSE_FRIDGES.forEach(function(fName) {
      var data = warehouseData[fName];
      var isFilled = data.temp !== "" && !isNaN(data.temp);
      if (isFilled) filledCount++;
      
      var card = document.createElement("div");
      card.className = "fridge-card" + (isFilled ? " filled" : "");
      card.setAttribute("aria-pressed", fName === activeWarehouseFridge);
      card.innerHTML = '<div class="f-top"><span>' + fName + '</span><i class="fa-solid ' + (isFilled ? 'fa-circle-check' : 'fa-circle-dot') + '"></i></div>' +
                       '<div class="f-status">' + (isFilled ? data.temp + ' °C' : 'ยังไม่กรอก') + '</div>';
      card.onclick = function() {
        saveCurrentFridgeInputs();
        activeWarehouseFridge = fName;
        drawWarehouseFridges();
        loadActiveFridgeInputs();
        if ($("fridgeCardTitle")) $("fridgeCardTitle").textContent = "ตู้เย็น " + activeWarehouseFridge;
        live();
      };
      grid.appendChild(card);
    });
    if ($("fridgeCountStatus")) $("fridgeCountStatus").textContent = "กรอกแล้ว " + filledCount + " จาก 4 ตู้";
  }

  function saveCurrentFridgeInputs() {
    if (S.zone === "คลังยา") {
      warehouseData[activeWarehouseFridge].temp = $("fridge") ? $("fridge").value : "";
      warehouseData[activeWarehouseFridge].hum = $("fridgeHum") ? $("fridgeHum").value : "";
    }
  }

  function loadActiveFridgeInputs() {
    if (S.zone === "คลังยา") {
      if ($("fridge")) $("fridge").value = warehouseData[activeWarehouseFridge].temp;
      if ($("fridgeHum")) $("fridgeHum").value = warehouseData[activeWarehouseFridge].hum;
    }
  }

  function updateWhoField() {
    var c = $("whoContainer");
    if (!c) return;
    if (S.zone === "ห้องยาตึกใหม่") {
      c.innerHTML = '<label for="who">ผู้บันทึก</label><select id="who" required><option value="" disabled selected>-- เลือกชื่อผู้บันทึก --</option><option value="ภัทราภรณ์">ภัทราภรณ์</option><option value="ณัชชา">ณัชชา</option><option value="เพ็ญลักษณ์">เพ็ญลักษณ์</option></select>';
      var whoSel = $("who");
      if (whoSel) {
        whoSel.addEventListener("change", function() { updateFormVisibility(); });
      }
    } else if (S.zone === "ห้องยาตึกเก่า") {
      c.innerHTML = '<label for="who">ผู้บันทึก</label><select id="who" required><option value="" disabled selected>-- เลือกชื่อผู้บันทึก --</option><option value="ระพีพรรณ">ระพีพรรณ</option><option value="รณชัย">รณชัย</option><option value="ปริยฉัตร">ปริยฉัตร</option><option value="ดาราณี">ดาราณี</option></select>';
    } else if (S.zone === "คลังยา") {
      c.innerHTML = '<label for="who">ผู้บันทึก</label><select id="who" required><option value="" disabled selected>-- เลือกชื่อผู้บันทึก --</option><option value="พงศ์พันธ์">พงศ์พันธ์</option><option value="นาวิน">นาวิน</option></select>';
    } else {
      c.innerHTML = '<label for="who">ผู้บันทึก</label><input id="who" placeholder="ชื่อ-นามสกุล / ตำแหน่ง" autocomplete="name">';
    }
    updateFormVisibility();
  }

  drawZones();
  updateSubZoneField();
  updateWarehouseField();
  updateWhoField();
  drawRounds();

  // ฟังก์ชันตรวจสอบและแจ้งเตือนตามรอบเวลาปัจจุบัน
  function checkTimeAlert() {
    var now = new Date();
    var hours = now.getHours();
    var minutes = now.getMinutes();
    var timeVal = hours * 60 + minutes; // แปลงเป็นนาทีรวมตั้งแต่เที่ยงคืน

    // รอบเช้า 09:00 - 11:00 (540 - 660 นาที)
    if (timeVal >= 540 && timeVal <= 660) {
      alert("แจ้งเตือน: ขณะนี้อยู่ในช่วงเวลารอบเช้า (09:00 น.) กรุณาตรวจสอบและบันทึกข้อมูลอุณหภูมิครับ");
    } 
    // รอบบ่าย 14:30 - 16:30 (870 - 990 นาที)
    else if (timeVal >= 870 && timeVal <= 990) {
      alert("แจ้งเตือน: ขณะนี้อยู่ในช่วงเวลารอบบ่าย (14:30 น.) กรุณาตรวจสอบและบันทึกข้อมูลอุณหภูมิครับ");
    }
  }

  function loadRemoteLogs() {
    try {
      fetch(WEB_APP_URL)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (Array.isArray(data)) {
            windowRemoteLogs = data;
            if ($("historyCount")) $("historyCount").textContent = "ประวัติ (" + data.length + ")";
            drawRounds();
            
            // เช็คว่าวันนี้ในโซนปัจจุบัน บันทึกรอบปัจจุบันไปหรือยัง ถ้ายังให้เตือน
            var currentLoc = S.zone.includes("ห้องผลิต") || S.zone.includes("ห้องยา") && $("subZoneSelect") ? $("subZoneSelect").value : S.zone;
            var now = new Date();
            var hours = now.getHours();
            var targetRoundName = (hours >= 13) ? "รอบบ่าย" : "รอบเช้า";
            
            var alreadyDone = windowRemoteLogs.some(function(m) {
              var itemLoc = m.subLocation || m.location;
              return m.date === $("date").value && itemLoc === currentLoc && m.round && m.round.includes(targetRoundName);
            });

            if (!alreadyDone) {
              checkTimeAlert();
            }
          }
        })
        .catch(function(e) { console.log("Offline mode or fetch error", e); });
    } catch(err) { console.log(err); }
  }
  loadRemoteLogs();

  function iso(d) { var m = d.getMonth() + 1, x = d.getDate(); return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (x < 10 ? "0" : "") + x; }
  if ($("date")) {
    $("date").value = iso(new Date());
    $("date").max = iso(new Date());
  }
  function showDate() {
    if (!$("date") || !$("dateShown")) return;
    var p = $("date").value.split("-");
    if (p.length === 3) {
      var y = parseInt(p[0]) + 543;
      $("dateShown").textContent = p[2] + "/" + p[1] + "/" + (String(y).slice(2));
    } else {
      $("dateShown").textContent = $("date").value;
    }
  }
  if ($("date")) {
    $("date").addEventListener("change", function() { showDate(); drawRounds(); });
    showDate();
  }

  if ($("historyBtn")) {
    $("historyBtn").addEventListener("click", function() { window.open("https://docs.google.com/spreadsheets/d/1OXD__jfv2o6cM8FyG5DzRFFqV3bajg5LoCEDnmjn1SA/view", "_blank"); });
  }

  if ($("subZoneSelect")) {
    $("subZoneSelect").addEventListener("change", function() { updateFormVisibility(); drawRounds(); });
  }

  function num(v) { if (v === undefined || v === null) return null; var s = String(v).trim().replace(",", "."); if (s === "" || isNaN(s)) return null; return parseFloat(s); }
  function fridgeStat(v) { if (v === null) return null; if (v < 2 || v > 8) return "bad"; if (v < 2.5 || v > 7.5) return "warn"; return "ok"; }
  function humStat(v) { if (v === null) return null; return (v < 30 || v > 70) ? "bad" : (v < 35 || v > 65) ? "warn" : "ok"; }
  var msg = { ok: "อยู่ในเกณฑ์ปกติ", warn: "ใกล้ขอบเกณฑ์ ควรเฝ้าระวัง", bad: "นอกเกณฑ์ ต้องแก้ไขและแจ้งหัวหน้า" };
  function badge(el, st, txt) { if (!el) return; el.className = "badge" + (st ? " " + st : ""); el.textContent = st ? txt : ""; }

  function live() {
    var f = num($("fridge") ? $("fridge").value : null), st = fridgeStat(f), pin = $("pin");
    saveCurrentFridgeInputs();
    if (S.zone === "คลังยา") drawWarehouseFridges();
    if (pin) {
      if (f === null) { pin.style.display = "none"; } else { pin.style.display = "block"; pin.style.left = Math.max(0, Math.min(12, f)) / 12 * 100 + "%"; }
    }
    if ($("fridge") && $("fridge").parentNode) $("fridge").parentNode.dataset.st = st || "";
    badge($("fridgeBadge"), st, msg[st] + (st === "bad" ? (f < 2 ? " (ต่ำกว่า 2.0)" : " (สูงกว่า 8.0)") : ""));
    var h = num($("hum") ? $("hum").value : null), hs = humStat(h);
    if ($("hum") && $("hum").parentNode) $("hum").parentNode.dataset.st = hs || "";
    badge($("humBadge"), hs, "ความชื้นห้องยา" + msg[hs]);
    var need = st === "bad" || hs === "bad";
    if ($("noteHint")) $("noteHint").textContent = need ? "(จำเป็น เพราะค่านอกเกณฑ์)" : "(ไม่บังคับ)";
  }
  ["fridge", "fridgeHum", "hum", "room"].forEach(function(i) { if ($(i)) { $(i).addEventListener("input", function() { live(); if ($(i + "Err")) $(i + "Err").classList.remove("show"); }); } });

  var tt; function toast(t) { 
    var e = $("toast"); if (!e) return; 
    e.textContent = t; 
    e.classList.add("show"); 
    if (typeof confetti === "function") {
      confetti({ particleCount: 100, spread: 80, origin: { y: 0.5 } });
    }
    clearTimeout(tt); 
    tt = setTimeout(function() { e.classList.remove("show"); }, 2500); 
  }

  if ($("save")) {
    $("save").addEventListener("click", function() {
      saveCurrentFridgeInputs();
      var r = num($("room") ? $("room").value : null), h = num($("hum") ? $("hum").value : null), ok = true, first = null;
      function bad(id) { if ($(id)) { $(id).classList.add("show"); } ok = false; if (!first) first = id.replace("Err", ""); }
      
      var subSel = $("subZoneSelect");
      var isSubStock = subSel && subSel.value.includes("substock");
      var whoSelect = $("who");
      var selectedWho = whoSelect ? whoSelect.value : "";
      var isPatraphon = (S.zone === "ห้องยาตึกใหม่" && selectedWho === "ภัทราภรณ์");
      var isNatchaOrPhen = (S.zone === "ห้องยาตึกใหม่" && (selectedWho === "ณัชชา" || selectedWho === "เพ็ญลักษณ์"));

      if (S.zone === "คลังยา") {
        var missing = WAREHOUSE_FRIDGES.some(function(fName) { return num(warehouseData[fName].temp) === null; });
        if (missing) {
          alert("กรุณากรอกอุณหภูมิตู้เย็นให้ครบทั้ง 4 ตู้ (T31, T32, TH1, TV1)");
          ok = false;
          first = "fridge";
        }
      } else if (!isNatchaOrPhen && !isSubStock) {
        var f = num($("fridge") ? $("fridge").value : null);
        if (f === null) bad("fridgeErr");
      }
      
      if (!isPatraphon) {
        if (r === null) bad("roomErr"); 
        if (h === null) bad("humErr");
      }
      
      var hasBad = false;
      if (S.zone === "คลังยา") {
        WAREHOUSE_FRIDGES.forEach(function(fName) {
          var val = num(warehouseData[fName].temp);
          if (val < 2 || val > 8) hasBad = true;
        });
      } else if (!isNatchaOrPhen && !isSubStock) {
        var f = num($("fridge") ? $("fridge").value : null);
        if (f < 2 || f > 8) hasBad = true;
      }
      if (!isPatraphon) {
        var hs = humStat(h);
        if (hs === "bad") hasBad = true;
      }

      if (hasBad && $("note") && !$("note").value.trim()) { bad("noteErr"); if (first === null) first = "note"; }
      if (!ok) { if (first && $(first)) { $(first).focus(); } return; }

      var zoneVal = S.zone;
      var subLocVal = (zoneVal.includes("ห้องผลิต") || zoneVal.includes("ห้องยา")) && $("subZoneSelect") ? $("subZoneSelect").value : zoneVal;
      var targetTab = zoneVal.includes("ห้องผลิต") ? "ห้องผลิต" : zoneVal;
      var activeRounds = getActiveRounds();
      var roundObj = activeRounds.filter(function(x) { return x.id === S.round; })[0];
      var roundText = roundObj ? (roundObj.n + " (" + roundObj.t + ")") : S.round;
      var statusText = hasBad ? "ผิดปกติ" : "ปกติ";
      var recorderVal = whoSelect ? whoSelect.value.trim() : "";

      var payloads = [];
      if (S.zone === "คลังยา") {
        WAREHOUSE_FRIDGES.forEach(function(fName) {
          payloads.push({
            date: $("date") ? $("date").value : "",
            location: targetTab,
            subLocation: zoneVal + " (" + fName + ")",
            round: roundText,
            fridgeTemp: num(warehouseData[fName].temp),
            fridgeHumidity: num(warehouseData[fName].hum),
            roomTemp: r,
            humidity: h,
            status: (num(warehouseData[fName].temp) < 2 || num(warehouseData[fName].temp) > 8 || humStat(h) === "bad") ? "ผิดปกติ" : "ปกติ",
            recorder: recorderVal,
            note: $("note") ? $("note").value.trim() : ""
          });
        });
      } else {
        payloads.push({
          date: $("date") ? $("date").value : "",
          location: targetTab,
          subLocation: subLocVal,
          round: roundText,
          fridgeTemp: (isNatchaOrPhen || isSubStock) ? null : num($("fridge") ? $("fridge").value : null),
          fridgeHumidity: (isNatchaOrPhen || isSubStock) ? null : num($("fridgeHum") ? $("fridgeHum").value : null),
          roomTemp: isPatraphon ? null : r,
          humidity: isPatraphon ? null : h,
          status: statusText,
          recorder: recorderVal,
          note: $("note") ? $("note").value.trim() : ""
        });
      }

      toast("ขอบคุณที่ให้ความร่วมมือจ้า");
      
      if (S.zone === "คลังยา") {
        warehouseData = { "T31": {temp: "", hum: ""}, "T32": {temp: "", hum: ""}, "TH1": {temp: "", hum: ""}, "TV1": {temp: "", hum: ""} };
        drawWarehouseFridges();
      }
      ["fridge", "fridgeHum", "room", "hum", "note"].forEach(function(i) { if ($(i)) { $(i).value = ""; } });
      live();
      window.scrollTo({ top: 0, behavior: "smooth" });
      drawRounds();

      payloads.forEach(function(payload, idx) {
        setTimeout(function() {
          fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          }).catch(function(err) { console.error(err); });
        }, idx * 300);
      });
    });
  }
});
</script>
